name: Pathfinder Locked Evaluation and Replay

on:
  pull_request:
    paths:
      - ".poc/evaluation/locked_holdout.jsonl"
      - ".poc/evaluation/holdout-lock.json"
      - ".poc/evaluation/audit_locked_holdout.py"
      - ".poc/replay/**"
      - ".poc/scope/**"
      - ".poc/review_sampling/**"
      - ".poc/tests/**"
      - ".poc/requirements.txt"
      - ".github/workflows/pathfinder-replay.yml"
  workflow_dispatch:
    inputs:
      event_path:
        description: "Repository-relative JSON evidence event to replay"
        required: true
        default: ".poc/scope/event-template.json"
        type: string

permissions:
  contents: read

jobs:
  validate-and-replay:
    name: Quarantine, tests, and deterministic replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install PoC Python dependencies
        run: python -m pip install --disable-pip-version-check -r .poc/requirements.txt
      - name: Validate the locked unlabeled holdout
        run: python .poc/evaluation/audit_locked_holdout.py --output "$RUNNER_TEMP/holdout-audit.json"
      - name: Run offline unit tests
        run: python -m unittest discover -s .poc/tests -v
      - name: Replay a single evidence-backed event twice
        env:
          EVENT_PATH: ${{ inputs.event_path || '.poc/scope/event-template.json' }}
        run: |
          python .poc/replay/replay_event.py \
            --event-json "$EVENT_PATH" \
            --output "$RUNNER_TEMP/pathfinder-replay.json" \
            --verify-repeat
      - name: Publish integrity and replay artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pathfinder-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/holdout-audit.json
            ${{ runner.temp }}/pathfinder-replay.json
          if-no-files-found: warn
          retention-days: 30
