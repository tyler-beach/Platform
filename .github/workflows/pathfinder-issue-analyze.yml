name: Pathfinder Issue Package Evaluation

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to evaluate"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: pathfinder-issue-analyze-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve issue number
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.title, '[Pathfinder analyze]') ||
      contains(join(github.event.issue.labels.*.name, ','), 'pathfinder-analyze')
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.issue.outputs.number }}
    steps:
      - name: Resolve issue number
        id: issue
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=${INPUT_ISSUE}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Go staged analyze
    needs: resolve
    uses: ./.github/workflows/pathfinder-go-analyze.yml
    with:
      issue_number: ${{ needs.resolve.outputs.number }}
      comment: true
    permissions:
      contents: write
      issues: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
