name: OpenSpec validation

on:
  pull_request:
    paths:
      - "openspec/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/OPEN_SPEC_WORKFLOW.md"
      - "docs/ENGINEERING_PLAYBOOK.md"
      - ".github/workflows/openspec.yml"
  push:
    branches: [main]
    paths:
      - "openspec/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/OPEN_SPEC_WORKFLOW.md"
      - "docs/ENGINEERING_PLAYBOOK.md"
      - ".github/workflows/openspec.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenSpec artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.14.0
      - name: Show OpenSpec version
        run: openspec --version
      - name: Validate active changes and current-state specs
        run: openspec validate --all --strict --no-interactive
