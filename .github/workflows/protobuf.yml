name: Protobuf contracts

on:
  pull_request:
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/protobuf.yml"

permissions:
  contents: read

jobs:
  lint-and-breaking:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
      - name: Lint Protobuf schema
        run: buf lint
      - name: Build Protobuf schema
        run: buf build
      - name: Check for breaking changes against main
        run: buf breaking --against '.git#branch=main'
