name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-requirements.txt"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "src/**"
      - "scripts/**"
      - ".poc/**"
      - ".github/demo/**"
      - ".github/workflows/poc-analysis.yml"
      - ".github/workflows/poc-evaluation.yml"
      - ".github/workflows/functional-analysis-demo.yml"
      - ".github/workflows/persist-functional-analysis.yml"
      - "docs/javascripts/**"
      - ".github/workflows/docs.yml"
      - "proto/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-requirements.txt"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "src/**"
      - "scripts/**"
      - ".poc/**"
      - ".github/demo/**"
      - ".github/workflows/poc-analysis.yml"
      - ".github/workflows/poc-evaluation.yml"
      - ".github/workflows/functional-analysis-demo.yml"
      - ".github/workflows/persist-functional-analysis.yml"
      - "docs/javascripts/**"
      - ".github/workflows/docs.yml"
      - "proto/**"
  workflow_run:
    workflows: ["ADR Deviation PoC Analysis", "ADR Deviation Labeled Evaluation", "Functional Analysis Demo", "Functional Analysis Audit Persistence"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - name: Set up Go for the synthetic PoC walkthrough
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
      - name: Set up Node for browser behavior tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install React site and PoC dependencies
        run: |
          npm ci
          python -m pip install -r docs-requirements.txt -r .poc/requirements.txt
      - name: Validate OpenAPI contract
        run: openapi-spec-validator docs/openapi.yaml
      - name: Generate Markdown doc index for Pages
        run: node scripts/generate-doc-index.mjs
      - name: Run deterministic PoC behavior tests
        run: python -m unittest discover -s .poc/tests -v
      - name: Run site and explorer behavior tests
        run: npm test
      - name: Build React Pages application
        run: npm run build
      - name: Generate the synthetic mock walkthrough from the PoC
        env:
          DEMO_ROOT: ${{ runner.temp }}/adr-poc-pages-demo
        run: |
          mkdir -p "$DEMO_ROOT"
          python .poc/run.py \
            --source .poc/fixtures/go \
            --language go \
            --comparison spec-vs-implementation \
            --provider mock \
            --run-id pages-fixture-walkthrough \
            --root-function Submit \
            --db-dir "$DEMO_ROOT/db" \
            --out-dir "$DEMO_ROOT/runs" \
            --adr-path .poc/fixtures/go/ADR-001.md \
            --spec-path .poc/fixtures/go/technical-spec.md \
            --diff-path .poc/fixtures/go/change.diff
          mkdir -p site/demo/data
          python .poc/demo/export_site_snapshot.py \
            --db-dir "$DEMO_ROOT/db" \
            --run-dir "$DEMO_ROOT/runs/pages-fixture-walkthrough" \
            --fixture-root .poc/fixtures/go \
            --output site/demo/data/sample-run.json
      - name: Build redacted paste-evaluation demo snapshot
        run: |
          mkdir -p site/demo/data
          python .poc/demo/export_paste_eval_snapshot.py \
            --output site/demo/data/paste-eval-snapshot.json \
            --prepare-fixture-output site/demo/data/paste-prepare-fixture.json
      - name: Validate generated walkthrough data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          page = Path("site/demo/index.html").read_text(encoding="utf-8")
          data = json.loads(Path("site/demo/data/sample-run.json").read_text(encoding="utf-8"))
          paste = json.loads(Path("site/demo/data/paste-eval-snapshot.json").read_text(encoding="utf-8"))
          assert 'id="root"' in page
          assert data["schema_version"] == "adr-demo-run-v1"
          assert data["sample"]["synthetic"] is True and data["sample"]["provider"] == "mock"
          assert data["stages"] and data["evidence"] and data["confidence"]["components"]
          assert "not a calibrated probability" in data["confidence"]["interpretation"].lower()
          assert paste["schema_version"] == "pathfinder-paste-eval-demo-v1"
          assert paste["backbone"] == "github-issues-actions"
          assert paste["observation_count"] > 0
          assert "sk-live" not in json.dumps(paste)
          # Vite embeds the demo mount markers into the JS bundle; HTML shell still has #root.
          bundle = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in Path("site/assets").glob("*.js"))
          assert "demo-paste-eval" in bundle
          assert "pathfinder-analyze.yml" in bundle
          print(f"Validated generated demo walkthrough ({len(data['stages'])} stages, {len(data['evidence'])} evidence items).")
          print(f"Validated paste-eval snapshot ({paste['observation_count']} observations, status={paste['aggregate_status']}).")
          PY
      - name: Generate and validate the synthetic scenario gallery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          live_args=()
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            live_args+=(--include-live)
          fi
          python .github/demo/build_scenario_gallery.py --repository-root . --repository "$GITHUB_REPOSITORY" --output site/demo/data/scenario-gallery.json "${live_args[@]}"
          python - <<'PY'
          import json
          from pathlib import Path
          catalog_path = Path("site/demo/data/scenario-gallery.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          expected = {f"{mode}--{sample}" for mode in ("code-diff", "technical-spec", "spec-vs-implementation")
                      for sample in ("deviation", "aligned", "insufficient-evidence")}
          actual = {item["id"] for item in catalog["scenarios"]}
          assert catalog["schema_version"] == "adr-synthetic-gallery-v1"
          assert catalog["scenario_count"] == len(catalog["scenarios"]) and expected <= actual
          assert len(actual) <= 19
          assert catalog["live_import"]["imported"] == len(actual - expected)
          assert all(item["validation_status"] == "passed" and all(check["passed"] for check in item["validation_checks"])
                     for item in catalog["scenarios"])
          assert catalog_path.stat().st_size <= 5 * 1024 * 1024
          print(f"Validated {len(catalog['scenarios'])} synthetic scenarios ({catalog_path.stat().st_size} bytes).")
          PY
      - name: Prepare bounded real run history for internal Pages
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HISTORY_OPT_IN: ${{ vars.PAGES_ACTIONS_HISTORY_ENABLED }}
          REAL_DATA_OPT_IN: ${{ vars.PAGES_REAL_RUN_DATA_ENABLED }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEMO_ROOT: ${{ runner.temp }}/adr-poc-pages-demo
        run: |
          set -euo pipefail
          if [[ "$HISTORY_OPT_IN" != "true" && "$REAL_DATA_OPT_IN" != "true" ]]; then
            mkdir -p site/demo/data
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("site/demo/data/real-runs.json")
          path.write_text(json.dumps({
              "schema_version": "adr-demo-history-v1", "repository": os.environ.get("GITHUB_REPOSITORY", "tyler-beach/Platform"),
              "data_available": False,
              "api_history_available": False, "run_count": 0, "workflow_runs": [], "runs": [],
              "message": "Actions history and detailed run records are disabled for this Pages deployment."
          }, indent=2) + "\n", encoding="utf-8")
          PY
            echo "Pages will contain the synthetic fixture walkthrough only; both real-data exports are disabled."
            exit 0
          fi
          repository_info="$(gh api "/repos/${GITHUB_REPOSITORY}")"
          pages_info="$(gh api "/repos/${GITHUB_REPOSITORY}/pages")"
          python - "$repository_info" "$pages_info" "$HISTORY_OPT_IN" "$REAL_DATA_OPT_IN" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".poc/demo").resolve()))
          from pages_visibility import actions_history_export_enabled, real_data_export_enabled
          repository = json.loads(sys.argv[1])
          pages = json.loads(sys.argv[2])
          owner = repository.get("owner", {})
          owner_type = owner.get("type", "") if isinstance(owner, dict) else ""
          visibility = repository.get("visibility", "")
          pages_public = pages.get("public")
          actions_history_export_enabled(visibility, owner_type, pages_public, sys.argv[3])
          real_data_export_enabled(visibility, owner_type, pages_public, sys.argv[4])
          print("Organization repository visibility and private Pages access verified.")
          PY
          db_dir="$DEMO_ROOT/real-db"
          mkdir -p "$db_dir"
          if [[ "$REAL_DATA_OPT_IN" == "true" ]]; then
            if gh api "/repos/${GITHUB_REPOSITORY}/branches/poc-database" >/dev/null 2>&1; then
              gh repo clone "$GITHUB_REPOSITORY" "$RUNNER_TEMP/poc-db-pages" -- --depth 1 --single-branch --branch poc-database
              cp "$RUNNER_TEMP/poc-db-pages/.poc-db/"*.csv "$db_dir/"
            else
              python - "$db_dir" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".poc").resolve()))
          from store import CsvStore
          CsvStore(sys.argv[1])
          PY
            fi
          else
            python - "$db_dir" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(".poc").resolve()))
          from store import CsvStore
          CsvStore(sys.argv[1])
          PY
          fi
          history_args=()
          if [[ "$HISTORY_OPT_IN" == "true" ]]; then
            python .poc/demo/actions_history.py --output "$DEMO_ROOT/actions-history.json"
            history_args+=(--actions-history "$DEMO_ROOT/actions-history.json")
          else
            echo "Actions history collection disabled; CSV ledger projection remains independently controlled."
          fi
          python .poc/demo/export_site_snapshot.py \
            --db-dir "$db_dir" --history --limit 20 \
            --repository "$GITHUB_REPOSITORY" \
            "${history_args[@]}" \
            --output site/demo/data/real-runs.json
      - name: Verify React Pages output and compatibility assets
        run: node scripts/verify-pages-output.mjs
      - name: Validate architecture diagrams
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          diagram_dir = Path("docs/assets/diagrams")
          icon_dir = Path("docs/assets/aws-icons")
          diagrams = sorted(diagram_dir.glob("*.svg"))
          expected = {
              "system-architecture.svg",
              "trust-boundaries.svg",
              "analysis-workflow.svg",
              "token-budget.svg",
              "engineering-loop.svg",
          }
          present = {path.name for path in diagrams}
          missing = expected - present
          assert not missing, f"Missing architecture diagrams: {sorted(missing)}"

          minimum_text_nodes = {
              "system-architecture.svg": 65,
              "trust-boundaries.svg": 70,
              "analysis-workflow.svg": 45,
              "token-budget.svg": 40,
              "engineering-loop.svg": 30,
          }
          for path in diagrams:
              root = ET.parse(path).getroot()
              assert root.attrib.get("viewBox"), f"{path} must have a viewBox so it scales to the page."
              text_nodes = root.findall(".//{http://www.w3.org/2000/svg}text")
              assert len(text_nodes) >= minimum_text_nodes.get(path.name, 1), (
                  f"{path} appears incomplete: found only {len(text_nodes)} text elements."
              )
              for node in root.iter():
                  href = node.attrib.get("href") or node.attrib.get("{http://www.w3.org/1999/xlink}href")
                  assert not (href and href.startswith("../aws-icons/")), (
                      f"{path} must inline its AWS icons; SVG-in-img external icon references are unreliable."
                  )
          styles = Path("src/styles.css").read_text(encoding="utf-8")
          assert ".diagram-viewport" in styles and ".diagram-dialog" in styles
          assert "max-width: 100%" in styles
          assert "@media (prefers-reduced-motion: reduce)" in styles
          print(f"Validated {len(diagrams)} SVGs, all relative AWS icon references, and page-fit diagram styling.")
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
