name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs-requirements.txt"
      - ".github/workflows/docs.yml"
      - "proto/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs-requirements.txt"
      - ".github/workflows/docs.yml"
      - "proto/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs-requirements.txt
      - name: Validate OpenAPI contract
        run: openapi-spec-validator docs/openapi.yaml
      - name: Build documentation site
        run: mkdocs build --strict
      - name: Verify homepage artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("site/index.html").read_text(encoding="utf-8")
          assert "Make architectural drift" in html, "Homepage headline is missing; unexpected homepage may have been built."
          assert "home-hero" in html, "Branded homepage hero markup is missing."
          assert "stylesheets/extra.css" in html, "Custom design stylesheet is not referenced."
          assert Path("site/assets/brand-mark.svg").is_file(), "Expected custom brand mark is missing."

          raw_icons = re.findall(r":(?:material|octicons)-[a-z0-9-]+:", html)
          assert not raw_icons, f"Unrendered icon shortcodes found on homepage: {raw_icons}"

          print("Homepage artifact contains the expected branded hero, stylesheet, logo, and no raw Material/Octicons shortcode text.")
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
