name: ADR Deviation Labeled Evaluation

on:
  pull_request:
    paths:
      - ".poc/evaluation/**"
      - ".poc/model.py"
      - ".poc/confidence.py"
      - ".poc/observations.py"
      - ".poc/run.py"
      - ".poc/store.py"
      - ".poc/tests/**"
      - ".github/workflows/poc-evaluation.yml"
  workflow_dispatch:
    inputs:
      provider:
        description: mock runs offline; anthropic makes paid live model calls
        required: true
        default: mock
        type: choice
        options: [mock, anthropic]

permissions:
  contents: read

jobs:
  evaluate:
    name: Labeled evaluation / ${{ inputs.provider || 'mock' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run evaluation unit tests
        run: |
          python -m pip install --disable-pip-version-check -r .poc/requirements.txt
          python -m unittest discover -s .poc/tests -v
      - name: Execute labeled cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || 'mock' }}
        run: |
          python .poc/evaluation/evaluate.py --provider "$PROVIDER" --output-dir "$RUNNER_TEMP/adr-deviation-evaluation"
      - name: Audit the 50-ADR corpus and configuration evidence
        run: python .poc/evaluation/evaluate_adr_corpus.py --output-dir "$RUNNER_TEMP/adr-deviation-evaluation"
      - name: Publish evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adr-deviation-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/adr-deviation-evaluation/evaluation.md
            ${{ runner.temp }}/adr-deviation-evaluation/evaluation.json
            ${{ runner.temp }}/adr-deviation-evaluation/adr-corpus-evaluation.md
            ${{ runner.temp }}/adr-deviation-evaluation/adr-corpus-evaluation.json
          if-no-files-found: warn
          retention-days: 30
