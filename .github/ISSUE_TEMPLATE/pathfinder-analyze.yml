name: Pathfinder analyze package
description: Submit a tech spec and/or code evidence package for multi-ADR catalog evaluation.
title: "[Pathfinder analyze] "
labels:
  - pathfinder-analyze
body:
  - type: markdown
    attributes:
      value: |
        Submit a **pinned evidence package** for evaluation against the **prototype real ADR pack** (20 platform-style ADRs under `data/adr_catalog`).

        **First run:** see `docs/PATHFINDER_FIRST_RUN.md`.

        **This repository is public.** Do not paste secrets, credentials, private customer data, or proprietary source. Use synthetic or explicitly public examples only.

        You can either:
        1. Paste a full JSON package in the **Full package JSON** field, or
        2. Link a **same-repo pull request** (changed text files are fetched), and/or
        3. Paste a **Tech spec** and/or single **Sample code** snippet, and optionally Domains.

        Multi-file code must come from a same-repo PR (forks are rejected). Tech spec is optional when a PR is provided.
        A deterministic paste extractor turns high-confidence claims into typed observations.
        Hand-written **Observations JSON** is optional and overrides extraction when provided.
        Unextracted predicates stay `inconclusive` (silence is not treated as compliance).
  - type: checkboxes
    id: attestation
    attributes:
      label: Public / synthetic attestation
      description: Required before evaluation runs.
      options:
        - label: I attest this submission contains only synthetic or explicitly public content and no secrets or confidential source.
          required: true
  - type: dropdown
    id: catalog_pack
    attributes:
      label: Catalog pack
      description: Real prototype pack is the product default. Synthetic ADR-101–200 is demo-only.
      options:
        - Real prototype pack (default)
        - Synthetic demo catalog (ADR-101–200)
      default: 0
    validations:
      required: true
  - type: textarea
    id: domains
    attributes:
      label: Domains (optional scope filter)
      description: Comma-separated. Leave blank to evaluate all active pack domains (api, cicd, identity, messaging, observability, reliability, security). Narrowing domains marks other requirements not_applicable — not aligned.
      placeholder: identity, security, reliability
    validations:
      required: false
  - type: input
    id: pull_request
    attributes:
      label: Same-repo pull request (optional)
      description: Same-repository PR URL, `owner/repo#n`, `#n`, or `n`. Changed text files are packed (caps + secret-path denylist). Forks and cross-repo PRs are denied.
      placeholder: https://github.com/OWNER/REPO/pull/123
    validations:
      required: false
  - type: textarea
    id: package_json
    attributes:
      label: Full package JSON (preferred)
      description: Paste a complete `pathfinder-evidence-package-v1` object, optionally wrapped in a ```pathfinder-package fence. If provided, this overrides the separate fields below.
      render: json
    validations:
      required: false
  - type: textarea
    id: tech_spec
    attributes:
      label: Tech spec (markdown)
      description: Optional if Full package JSON or a same-repo PR is provided. Max ~50KB.
      placeholder: "# Service tech spec\n\nSessions expire after 12 minutes..."
    validations:
      required: false
  - type: textarea
    id: code
    attributes:
      label: Sample code
      description: Optional single snippet (not a multi-file bundle). Max ~50KB. Prefer synthetic examples. For multiple files, use a same-repo PR.
      render: javascript
    validations:
      required: false
  - type: textarea
    id: observations
    attributes:
      label: Observations JSON array (optional)
      description: Optional override. If omitted, Pathfinder extracts allowlisted predicates from Tech spec / Sample code. See docs/ISSUE_ANALYZE_WORKFLOW.md.
      render: json
      placeholder: |
        [
          {
            "evidence_id": "EV-TTL",
            "predicate": "session.ttl_seconds",
            "subject": "session",
            "value": 720,
            "locator": {"kind": "tech_spec_claim", "value": "session.ttl_seconds"}
          }
        ]
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        After you submit, the **Pathfinder Issue Package Evaluation** workflow comments aggregate status and outcome counts, uploads the full report as a workflow artifact (~14 day retention), and appends a lean record on the `pathfinder-jobs` branch.
