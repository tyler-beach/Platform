site_name: ADR Deviation Platform
site_description: Contract-first engineering and operations documentation for the ADR Deviation Platform
site_url: https://tyler-beach.github.io/Platform/
repo_url: https://github.com/tyler-beach/Platform
repo_name: tyler-beach/Platform
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tyler-beach/Platform

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture:
      - System diagrams: architecture.md
      - Architecture overview: ARCHITECTURE.md
      - RPC and Protobuf: RPC_AND_PROTOBUF.md
      - AI pipeline: AI_PIPELINE.md
      - Functional core: FUNCTIONAL_CORE.md
  - API:
      - Interactive API reference: api/index.md
      - OpenAPI spec: openapi.yaml
      - API behavior and versioning: contracts/API_CONTRACT.md
  - Contracts:
      - Data types and invariants: contracts/CONTRACTS.md
      - Evidence and provenance: contracts/EVIDENCE.md
      - Logging, tracing and audit: contracts/LOGGING_AND_AUDIT.md
      - Existing data model: DATA_MODEL.md
  - How-to:
      - Guides: how-to/index.md
      - Add an input source: how-to/add-input-source.md
      - Add a Go worker: how-to/add-go-worker.md
      - Add a comparison mode: how-to/add-comparison-mode.md
  - Engineering:
      - AI technology selection: AI_TECHNOLOGY_SELECTION.md
      - AI decision matrix: AI_TECHNOLOGY_DECISION_MATRIX.md
      - Evaluation and observability: AI_EVALUATION_OBSERVABILITY.md
      - Go tooling: GO_TOOLING.md
      - Security: SECURITY.md
      - Operations: OPERATIONS.md
      - Evaluation: EVALUATION.md
      - OpenSpec workflow: OPEN_SPEC_WORKFLOW.md
      - Roadmap: ROADMAP.md
      - Decisions: DECISIONS.md
      - Open questions: OPEN_QUESTIONS.md
      - Tools and references: TOOLS_AND_REFERENCES.md
      - Contributing: CONTRIBUTING.md
