site_name: ADR Deviation Platform
site_description: Evidence-first architecture analysis — design, contracts and engineering practice
site_url: !ENV [ADR_SITE_URL, "https://tyler-beach.github.io/Platform/"]
repo_url: !ENV [ADR_REPO_URL, "https://github.com/tyler-beach/Platform"]
repo_name: !ENV [ADR_REPO_NAME, "tyler-beach/Platform"]
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  /ARCHITECTURE.md
  /architecture.md
copyright: 'ADR Deviation Platform · Engineering design reference'
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/brand-mark.svg
  favicon: assets/brand-mark.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/diagram-viewer.js
  - javascripts/demo-explorer.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: !ENV [ADR_REPO_URL, "https://github.com/tyler-beach/Platform"]

nav:
  - Overview:
      - Platform overview: index.md
      - Project brief: PROJECT_BRIEF.md
      - Getting started: getting-started.md
      - Roadmap: ROADMAP.md
      - Pre-implementation readiness: PRE_IMPLEMENTATION_READINESS.md
      - MVP decision packet: MVP_DECISION_PACKET.md
      - Decision log: DECISIONS.md
      - Open questions: OPEN_QUESTIONS.md
  - Architecture:
      - System architecture and workflows: system-architecture.md
      - Architecture overview: architecture-overview.md
      - Diagram catalog: diagrams/architecture.md
      - Diagram sources: diagrams/README.md
      - Diagram asset attribution: assets/aws-icons/README.md
      - RPC and Protobuf: RPC_AND_PROTOBUF.md
      - AI pipeline and token budgets: AI_PIPELINE.md
      - Functional core: FUNCTIONAL_CORE.md
  - API:
      - Interactive API reference: api/index.md
      - OpenAPI spec: openapi.yaml
      - API behavior and versioning: contracts/API_CONTRACT.md
  - Contracts:
      - Data types and invariants: contracts/CONTRACTS.md
      - Evidence and provenance: contracts/EVIDENCE.md
      - Logging, tracing and audit: contracts/LOGGING_AND_AUDIT.md
      - AI runtime and token budgets: contracts/AI_RUNTIME.md
      - Existing data model: DATA_MODEL.md
  - Engineering:
      - Interactive PoC demo: demo/index.md
      - Functional analysis demo: functional-analysis-demo.md
      - Executable semantic-analysis PoC: EXECUTABLE_POC.md
      - Go tooling: GO_TOOLING.md
      - Enable the internal Pages run explorer: how-to/enable-private-pages-demo.md
      - How-to guides:
          - Guide index: how-to/index.md
          - Add an input source: how-to/add-input-source.md
          - Add a Go worker: how-to/add-go-worker.md
          - Add a comparison mode: how-to/add-comparison-mode.md
      - ADR scope retrieval: ADR_SCOPE_RETRIEVAL.md
      - Engineering playbook: ENGINEERING_PLAYBOOK.md
      - OpenSpec workflow: OPEN_SPEC_WORKFLOW.md
      - Adversarial design review: ADVERSARIAL_DESIGN_REVIEW.md
      - AI technology selection: AI_TECHNOLOGY_SELECTION.md
      - AI decision matrix: AI_TECHNOLOGY_DECISION_MATRIX.md
      - Evaluation and observability: AI_EVALUATION_OBSERVABILITY.md
      - Security: SECURITY.md
      - Operations: OPERATIONS.md
      - Evaluation: EVALUATION.md
      - Requirements-to-proof matrix: REQUIREMENT_TO_PROOF_MATRIX.md
      - Evaluation corpus guide: evaluation/README.md
      - Starter evaluation corpus: evaluation/STARTER_CORPUS.md
      - Tools and references: TOOLS_AND_REFERENCES.md
      - Contributing: CONTRIBUTING.md
