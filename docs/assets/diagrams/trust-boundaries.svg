</style></defs><rect width="1520" height="805" fill="url(#bg)"/><text x="28" y="37" class="kicker" >TRUST MODEL  /  DATA FLOW</text><text x="28" y="76" class="title" >Where trust changes</text><text x="28" y="103" class="subtitle" >The application owns authorization, evidence validity and the decision to publish.</text><rect x="24" y="145" width="210" height="470" rx="15" fill="#fff9f2" stroke="#bd762b" stroke-width="2" stroke-dasharray="7 5"/><text x="38" y="168" class="tag" fill="#bd762b">TB-01</text><text x="38" y="191" class="boundary" >External input</text><rect x="42" y="218" width="174" height="78" rx="10" fill="#fff" stroke="#e8d5bd"/><circle cx="65" cy="240" r="8" fill="#71839b"/><text x="83" y="244" class="nodehead" >Caller / CI</text><text x="57" y="270" class="small" >Identity + signed request</text><rect x="42" y="315" width="174" height="95" rx="10" fill="#fff" stroke="#e8d5bd"/><rect x="58" y="333" width="26" height="30" rx="4" fill="#eef4fa" stroke="#8ca3bf"/><text x="94" y="343" class="nodehead" >Code / ADR</text><text x="58" y="384" class="small" >Untrusted source text</text><text x="58" y="400" class="small" >may contain injection</text><text x="42" y="452" class="copy" >Enforce signature,</text><text x="42" y="473" class="copy" >identity and input</text><text x="42" y="494" class="copy" >size / format limits.</text><rect x="42" y="530" width="174" height="62" rx="9" fill="#fff0e6"/><text x="53" y="554" class="small" fill="#995f1e">Never treat artifact text</text><text x="53" y="573" class="small" fill="#995f1e">as system instruction.</text><rect x="254" y="145" width="275" height="470" rx="15" fill="#f6f9fe" stroke="#5477a3" stroke-width="2" stroke-dasharray="7 5"/><text x="268" y="168" class="tag" fill="#5477a3">TB-02</text><text x="268" y="191" class="boundary" >Admission + authorization</text><g><rect x="323" y="218" width="130" height="98" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><g transform="translate(367 225) scale(0.65625 0.65625)" fill="none"><path fill="#8c4fff" d="M0 0h64v64H0z"/><path fill="#fff" fill-rule="evenodd" d="M28 44h3v-2h-3zm5 0h3v-2h-3zm-5-22h3v-2h-3zm5 0h3v-2h-3zm-11-9.26-10 5.834v27.808l10 5zM24 20h2v2h-2v20h2v2h-2v9a1 1 0 0 1-1.447.895l-12-6A1 1 0 0 1 10 47V18a1 1 0 0 1 .496-.864l12-7A1.002 1.002 0 0 1 24 11zm28-1.426L42 12.74v38.641l10-5zM54 18v29c0 .379-.214.725-.553.895l-12 6a1 1 0 0 1-.972-.044A1 1 0 0 1 40 53v-9h-2v-2h2V22h-2v-2h2v-9a.998.998 0 0 1 1.504-.864l12 7A1 1 0 0 1 54 18m-19.061 9.342-1.878-.684-4 11 1.878.684zm4.768 5.365a1 1 0 0 0 0-1.414l-3-3-1.414 1.414L37.586 32l-2.293 2.293 1.414 1.414zm-12.414 3-3-3a1 1 0 0 1 0-1.414l3-3 1.414 1.414L26.414 32l2.293 2.293z" clip-rule="evenodd"/></g><text x="388" y="283" class="svctitle" text-anchor="middle">API Gateway</text><text x="388" y="300" class="svcsub" text-anchor="middle">HTTPS</text></g><g><rect x="292" y="346" width="200" height="91" rx="11" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><g transform="translate(302 356) scale(0.5625 0.5625)"><g fill="none" fill-rule="evenodd"><path fill="#ed7100" d="M0 0h64v64H0z"/><path fill="#fff" d="M22.68 52h-9.106l10.264-21.59 4.562 9.451zm2.047-24.333a.99.99 0 0 0-.896-.564h-.003a.99.99 0 0 0-.896.569L11.097 52.569c-.147.31-.126.674.057.965.181.29.5.466.842.466H23.31a1 1 0 0 0 .9-.572l6.194-13.144a1 1 0 0 0-.005-.864zM51.008 52h-9.022L26.955 19.578a1 1 0 0 0-.903-.578h-5.924l.007-7h11.68l14.96 32.42c.163.354.516.58.904.58h3.33zm.996-9h-3.69l-14.96-32.42a1 1 0 0 0-.903-.58H19.14a1 1 0 0 0-.996.999l-.008 9A.993.993 0 0 0 19.131 21h6.286l15.03 32.422a1 1 0 0 0 .903.578h10.654c.55 0 .996-.448.996-1v-9c0-.552-.445-1-.996-1"/></g></g><text x="352" y="372" class="nodehead" >Admission Lambda</text><text x="352" y="391" class="nodecopy" >verify caller + workspace</text><text x="352" y="406" class="nodecopy" >check referenced artifacts</text></g><rect x="278" y="465" width="227" height="100" rx="10" fill="#fff" stroke="#d4deeb"/><text x="293" y="488" class="nodehead" >Authorization invariants</text><text x="293" y="510" class="nodecopy" >workspace selector ≠ identity</text><text x="293" y="528" class="nodecopy" >authorize every dereference</text><text x="293" y="546" class="nodecopy" >deny cross-tenant references</text><rect x="550" y="145" width="300" height="470" rx="15" fill="#f8f7ff" stroke="#8b69bd" stroke-width="2" stroke-dasharray="7 5"/><text x="564" y="168" class="tag" fill="#8b69bd">TB-03</text><text x="564" y="191" class="boundary" >Workflow + worker roles</text><g><rect x="635" y="218" width="130" height="98" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><g transform="translate(679 225) scale(0.65625 0.65625)"><g fill="none" fill-rule="evenodd"><path fill="#e7157b" d="M0 0h64v64H0z"/><path fill="#fff" d="M37 34h15v-4H37zm16-6H36a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h17a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1M34.5 49.5c0 1.378-1.121 2.5-2.5 2.5a2.503 2.503 0 0 1-2.5-2.5c0-1.378 1.121-2.5 2.5-2.5s2.5 1.122 2.5 2.5M12 38v-3h13v3H12m0-9v-3h13v3zm17.5-14.5c0-1.378 1.121-2.5 2.5-2.5s2.5 1.122 2.5 2.5S33.379 17 32 17a2.503 2.503 0 0 1-2.5-2.5M44 42H20v-2h6a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-6v-2h6a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-6v-2h24v4h2v-5a1 1 0 0 0-1-1H33v-1.121c2-.457 3.5-2.242 3.5-4.379 0-2.481-2.019-4.5-4.5-4.5a4.505 4.505 0 0 0-4.5 4.5c0 2.137 1.5 3.922 3.5 4.379V20H19a1 1 0 0 0-1 1v3h-7a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h7v2h-7a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h7v3a1 1 0 0 0 1 1h12v1.121c-2 .457-3.5 2.242-3.5 4.379 0 2.481 2.019 4.5 4.5 4.5s4.5-2.019 4.5-4.5c0-2.137-1.5-3.922-3.5-4.379V44h12a1 1 0 0 0 1-1v-5h-2z"/></g></g><text x="700" y="283" class="svctitle" text-anchor="middle">Step Functions</text><text x="700" y="300" class="svcsub" text-anchor="middle">durable lifecycle</text></g><g><rect x="578" y="348" width="242" height="92" rx="11" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><g transform="translate(588 358) scale(0.59375 0.59375)"><g fill="none" fill-rule="evenodd"><path fill="#ed7100" d="M0 0h64v64H0z"/><path fill="#fff" d="M22.68 52h-9.106l10.264-21.59 4.562 9.451zm2.047-24.333a.99.99 0 0 0-.896-.564h-.003a.99.99 0 0 0-.896.569L11.097 52.569c-.147.31-.126.674.057.965.181.29.5.466.842.466H23.31a1 1 0 0 0 .9-.572l6.194-13.144a1 1 0 0 0-.005-.864zM51.008 52h-9.022L26.955 19.578a1 1 0 0 0-.903-.578h-5.924l.007-7h11.68l14.96 32.42c.163.354.516.58.904.58h3.33zm.996-9h-3.69l-14.96-32.42a1 1 0 0 0-.903-.58H19.14a1 1 0 0 0-.996.999l-.008 9A.993.993 0 0 0 19.131 21h6.286l15.03 32.422a1 1 0 0 0 .903.578h10.654c.55 0 .996-.448.996-1v-9c0-.552-.445-1-.996-1"/></g></g><text x="638" y="374" class="nodehead" >Go Lambda worker stages</text><text x="638" y="393" class="nodecopy" >scoped execution role per task</text><text x="638" y="408" class="nodecopy" >bounded retries + deadlines</text></g><rect x="574" y="465" width="252" height="100" rx="10" fill="#fff" stroke="#d7cde9"/><text x="589" y="488" class="nodehead" >Untrusted-data boundary</text><text x="589" y="510" class="nodecopy" >source content never grants tools</text><text x="589" y="528" class="nodecopy" >model does not decide access</text><text x="589" y="546" class="nodecopy" >state machine owns job lifecycle</text><rect x="872" y="145" width="270" height="470" rx="15" fill="#f0fbf8" stroke="#008c84" stroke-width="2" stroke-dasharray="7 5"/><text x="886" y="168" class="tag" fill="#008c84">TB-04</text><text x="886" y="191" class="boundary" >Durable data + validation</text><g><rect x="942" y="218" width="130" height="98" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><g transform="translate(986 225) scale(0.65625 0.65625)"><g fill="none" fill-rule="evenodd"><path fill="#c925d1" d="M0 0h64v64H0z"/><path fill="#fff" d="M36.213 16.011h-2.016v-2.005h2.016V12h2.017v2.006h2.016v2.005H38.23v2.006h-2.017zm9.074 8.023h-2.016v-2.006h2.016v-2.005h2.016v2.005h2.017v2.006h-2.017v2.006h-2.016v-2.006m-3.434 22.64c-1.495-3.292-4.482-6.263-7.792-7.75 3.31-1.487 6.297-4.459 7.792-7.75 1.494 3.291 4.482 6.263 7.791 7.75-3.31 1.487-6.297 4.458-7.79 7.75m12.139-8.753c-5.202 0-11.13-5.898-11.13-11.071 0-.555-.452-1.003-1.009-1.003s-1.008.448-1.008 1.003c0 5.173-5.93 11.071-11.13 11.071-.558 0-1.009.448-1.009 1.003s.45 1.003 1.008 1.003c5.202 0 11.13 5.898 11.13 11.07 0 .554.452 1.003 1.01 1.003.556 0 1.007-.45 1.007-1.003 0-5.172 5.93-11.07 11.13-11.07.558 0 1.009-.45 1.009-1.003 0-.555-.45-1.003-1.008-1.003m-31.39-19.904c6.85 0 10.587 1.988 10.587 3.008s-3.737 3.009-10.586 3.009-10.587-1.988-10.587-3.009 3.737-3.008 10.587-3.008m-.35 15.15c-5.012 0-8.62-1.063-10.236-2.19v-7.113c2.367 1.433 6.487 2.176 10.587 2.176s8.22-.743 10.586-2.176v6.484c-1.016 1.406-5.247 2.819-10.936 2.819M33.19 45.975c0 1.435-4.126 3.52-10.59 3.52-6.46 0-10.583-2.085-10.583-3.52v-4.407c2.258 1.354 6.014 2.192 10.276 2.192 2.942 0 5.786-.413 8.01-1.166l-.651-1.898c-2.019.682-4.633 1.058-7.359 1.058-5.39 0-9.252-1.402-10.276-2.76v-5.707c2.411 1.176 6.113 1.885 10.237 1.885 3.92 0 8.34-.725 10.936-2.269v2.162h2.016v-14.04c0-3.292-6.34-5.014-12.602-5.014S10 17.733 10 21.025v24.95c0 3.59 6.49 5.526 12.598 5.526 6.112 0 12.607-1.937 12.607-5.526v-2.887h-2.016z"/></g></g><text x="1007" y="283" class="svctitle" text-anchor="middle">Aurora PostgreSQL</text><text x="1007" y="300" class="svcsub" text-anchor="middle">business record</text></g><rect x="895" y="348" width="224" height="92" rx="10" fill="#fff" stroke="#9acfc4"/><text x="910" y="371" class="nodehead" >Application-side validation</text><text x="910" y="394" class="nodecopy" >known evidence IDs + hashes</text><text x="910" y="412" class="nodecopy" >source revision + applicability</text><text x="910" y="430" class="nodecopy" >domain rules + state transition</text><rect x="895" y="465" width="224" height="100" rx="10" fill="#fff" stroke="#9acfc4"/><text x="910" y="488" class="nodehead" >Persist before publication</text><text x="910" y="510" class="nodecopy" >finding + source provenance</text><text x="910" y="528" class="nodecopy" >usage + audit + review state</text><text x="910" y="546" class="nodecopy" >freshness checked before effect</text><rect x="1164" y="145" width="330" height="470" rx="15" fill="#fff8ef" stroke="#bd762b" stroke-width="2" stroke-dasharray="7 5"/><text x="1178" y="168" class="tag" fill="#bd762b">TB-05</text><text x="1178" y="191" class="boundary" >External model / effects</text><rect x="1182" y="218" width="294" height="118" rx="11" fill="#fff" stroke="#e5c899" stroke-width="1.5"/><text x="1198" y="245" class="nodehead" >Direct Anthropic API</text><text x="1198" y="268" class="small" >HTTPS; minimal evidence package</text><text x="1198" y="289" class="small" >No credentials or tool authority</text><text x="1198" y="310" class="small" >Usage is reconciled to the job budget</text><rect x="1182" y="365" width="294" height="101" rx="11" fill="#fff" stroke="#e5c899" stroke-width="1.5"/><text x="1198" y="391" class="nodehead" >Validated publication gate</text><text x="1198" y="414" class="small" >Human review per policy</text><text x="1198" y="434" class="small" >fresh source + idempotency</text><text x="1198" y="454" class="small" >no AI-only merge blocking</text><rect x="1182" y="492" width="294" height="73" rx="11" fill="#fff0dc"/><text x="1198" y="516" class="nodehead" fill="#8d5a1c">Provider trust boundary</text><text x="1198" y="539" class="small" fill="#8d5a1c">Approved data-processing policy required</text><path d="M234 273 H323" fill="none" stroke="#bd762b" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearr)"/><path d="M453 267 H635" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M765 267 H942" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1072 267 H1182" fill="none" stroke="#bd762b" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearr)"/><path d="M820 391 H895" fill="none" stroke="#008c84" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarr)"/><path d="M1119 510 H1182" fill="none" stroke="#008c84" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarr)"/><text x="28" y="668" class="zone" >REQUIRED INVARIANTS</text><rect x="28" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="50" cy="714" r="11" fill="#e8eff9"/><text x="50" y="718" class="tag" text-anchor="middle" fill="#38557b">1</text><text x="70" y="716" class="small" >Caller identity and every</text><text x="70" y="735" class="small" >artifact reference are authorized</text><text x="70" y="754" class="small" >server-side.</text><rect x="324" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="346" cy="714" r="11" fill="#e8eff9"/><text x="346" y="718" class="tag" text-anchor="middle" fill="#38557b">2</text><text x="366" y="716" class="small" >Evidence cites the immutable</text><text x="366" y="735" class="small" >source version used for</text><text x="366" y="754" class="small" >the assessment.</text><rect x="620" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="642" cy="714" r="11" fill="#e8eff9"/><text x="642" y="718" class="tag" text-anchor="middle" fill="#38557b">3</text><text x="662" y="716" class="small" >Model output is a</text><text x="662" y="735" class="small" >candidate; Go validation is</text><text x="662" y="754" class="small" >authoritative.</text><rect x="916" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="938" cy="714" r="11" fill="#e8eff9"/><text x="938" y="718" class="tag" text-anchor="middle" fill="#38557b">4</text><text x="958" y="716" class="small" >Provider calls share one</text><text x="958" y="735" class="small" >cumulative job budget and</text><text x="958" y="754" class="small" >deadline.</text><rect x="1212" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="1234" cy="714" r="11" fill="#e8eff9"/><text x="1234" y="718" class="tag" text-anchor="middle" fill="#38557b">5</text><text x="1254" y="716" class="small" >External effects require freshness,</text><text x="1254" y="735" class="small" >authorization and idempotency.</text><text x="1254" y="754" class="small" ></text></svg>