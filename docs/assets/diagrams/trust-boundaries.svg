<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 805" role="img" aria-labelledby="title desc">
<title id="title">Trust boundaries and data handling</title><desc id="desc">Trust-boundary model from untrusted code and ADR input through API authorization, Step Functions and least-privileged workers, durable validation, external Anthropic processing and controlled publication.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526783"/></marker>
<marker id="tealarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#008c84"/></marker>
<marker id="orangearr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd762b"/></marker>
<style>
.kicker{font:800 13px Arial,system-ui,sans-serif;letter-spacing:1.8px;fill:#61748e}
.title{font:750 31px Arial,system-ui,sans-serif;letter-spacing:-.4px;fill:#152744}
.subtitle{font:400 16px Arial,system-ui,sans-serif;fill:#61748e}
.boundary{font:800 13px Arial,system-ui,sans-serif;letter-spacing:1.1px;fill:#304b70}
.zone{font:800 11.5px Arial,system-ui,sans-serif;letter-spacing:1px;fill:#52657e}
.svctitle{font:750 11.5px Arial,system-ui,sans-serif;fill:#1b2d49}
.svcsub{font:500 10px Arial,system-ui,sans-serif;fill:#6b7b91}
.nodehead{font:750 13px Arial,system-ui,sans-serif;fill:#162b48}
.nodecopy{font:500 10.5px Arial,system-ui,sans-serif;fill:#62748d}
.copy{font:500 13px Arial,system-ui,sans-serif;fill:#465d79}
.small{font:500 11.5px Arial,system-ui,sans-serif;fill:#637791}
.tiny{font:750 9.5px Arial,system-ui,sans-serif;letter-spacing:.25px;fill:#6a7b90}
.tag{font:800 10.5px Arial,system-ui,sans-serif;letter-spacing:.55px}
.flowlabel{font:700 10px Arial,system-ui,sans-serif;fill:#526783}
</style></defs><rect width="1520" height="805" fill="url(#bg)"/><text x="28" y="37" class="kicker" >TRUST MODEL  /  DATA FLOW</text><text x="28" y="76" class="title" >Where trust changes</text><text x="28" y="103" class="subtitle" >The application owns authorization, evidence validity and the decision to publish.</text><rect x="24" y="145" width="210" height="470" rx="15" fill="#fff9f2" stroke="#bd762b" stroke-width="2" stroke-dasharray="7 5"/><text x="38" y="168" class="tag" fill="#bd762b">TB-01</text><text x="38" y="191" class="boundary" >External input</text><rect x="42" y="218" width="174" height="78" rx="10" fill="#fff" stroke="#e8d5bd"/><circle cx="65" cy="240" r="8" fill="#71839b"/><text x="83" y="244" class="nodehead" >Caller / CI</text><text x="57" y="270" class="small" >Identity + signed request</text><rect x="42" y="315" width="174" height="95" rx="10" fill="#fff" stroke="#e8d5bd"/><rect x="58" y="333" width="26" height="30" rx="4" fill="#eef4fa" stroke="#8ca3bf"/><text x="94" y="343" class="nodehead" >Code / ADR</text><text x="58" y="384" class="small" >Untrusted source text</text><text x="58" y="400" class="small" >may contain injection</text><text x="42" y="452" class="copy" >Enforce signature,</text><text x="42" y="473" class="copy" >identity and input</text><text x="42" y="494" class="copy" >size / format limits.</text><rect x="42" y="530" width="174" height="62" rx="9" fill="#fff0e6"/><text x="53" y="554" class="small" fill="#995f1e">Never treat artifact text</text><text x="53" y="573" class="small" fill="#995f1e">as system instruction.</text><rect x="254" y="145" width="275" height="470" rx="15" fill="#f6f9fe" stroke="#5477a3" stroke-width="2" stroke-dasharray="7 5"/><text x="268" y="168" class="tag" fill="#5477a3">TB-02</text><text x="268" y="191" class="boundary" >Admission + authorization</text><g><rect x="323" y="218" width="130" height="98" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/api-gateway.svg" x="367" y="225" width="42" height="42"/><text x="388" y="283" class="svctitle" text-anchor="middle">API Gateway</text><text x="388" y="300" class="svcsub" text-anchor="middle">HTTPS</text></g><g><rect x="292" y="346" width="200" height="91" rx="11" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><image href="../aws-icons/lambda.svg" x="302" y="356" width="36" height="36"/><text x="352" y="372" class="nodehead" >Admission Lambda</text><text x="352" y="391" class="nodecopy" >verify caller + workspace</text><text x="352" y="406" class="nodecopy" >check referenced artifacts</text></g><rect x="278" y="465" width="227" height="100" rx="10" fill="#fff" stroke="#d4deeb"/><text x="293" y="488" class="nodehead" >Authorization invariants</text><text x="293" y="510" class="nodecopy" >workspace selector ≠ identity</text><text x="293" y="528" class="nodecopy" >authorize every dereference</text><text x="293" y="546" class="nodecopy" >deny cross-tenant references</text><rect x="550" y="145" width="300" height="470" rx="15" fill="#f8f7ff" stroke="#8b69bd" stroke-width="2" stroke-dasharray="7 5"/><text x="564" y="168" class="tag" fill="#8b69bd">TB-03</text><text x="564" y="191" class="boundary" >Workflow + worker roles</text><g><rect x="635" y="218" width="130" height="98" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/step-functions.svg" x="679" y="225" width="42" height="42"/><text x="700" y="283" class="svctitle" text-anchor="middle">Step Functions</text><text x="700" y="300" class="svcsub" text-anchor="middle">durable lifecycle</text></g><g><rect x="578" y="348" width="242" height="92" rx="11" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><image href="../aws-icons/lambda.svg" x="588" y="358" width="38" height="38"/><text x="638" y="374" class="nodehead" >Go Lambda worker stages</text><text x="638" y="393" class="nodecopy" >scoped execution role per task</text><text x="638" y="408" class="nodecopy" >bounded retries + deadlines</text></g><rect x="574" y="465" width="252" height="100" rx="10" fill="#fff" stroke="#d7cde9"/><text x="589" y="488" class="nodehead" >Untrusted-data boundary</text><text x="589" y="510" class="nodecopy" >source content never grants tools</text><text x="589" y="528" class="nodecopy" >model does not decide access</text><text x="589" y="546" class="nodecopy" >state machine owns job lifecycle</text><rect x="872" y="145" width="270" height="470" rx="15" fill="#f0fbf8" stroke="#008c84" stroke-width="2" stroke-dasharray="7 5"/><text x="886" y="168" class="tag" fill="#008c84">TB-04</text><text x="886" y="191" class="boundary" >Durable data + validation</text><g><rect x="942" y="218" width="130" height="98" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/aurora.svg" x="986" y="225" width="42" height="42"/><text x="1007" y="283" class="svctitle" text-anchor="middle">Aurora PostgreSQL</text><text x="1007" y="300" class="svcsub" text-anchor="middle">business record</text></g><rect x="895" y="348" width="224" height="92" rx="10" fill="#fff" stroke="#9acfc4"/><text x="910" y="371" class="nodehead" >Application-side validation</text><text x="910" y="394" class="nodecopy" >known evidence IDs + hashes</text><text x="910" y="412" class="nodecopy" >source revision + applicability</text><text x="910" y="430" class="nodecopy" >domain rules + state transition</text><rect x="895" y="465" width="224" height="100" rx="10" fill="#fff" stroke="#9acfc4"/><text x="910" y="488" class="nodehead" >Persist before publication</text><text x="910" y="510" class="nodecopy" >finding + source provenance</text><text x="910" y="528" class="nodecopy" >usage + audit + review state</text><text x="910" y="546" class="nodecopy" >freshness checked before effect</text><rect x="1164" y="145" width="330" height="470" rx="15" fill="#fff8ef" stroke="#bd762b" stroke-width="2" stroke-dasharray="7 5"/><text x="1178" y="168" class="tag" fill="#bd762b">TB-05</text><text x="1178" y="191" class="boundary" >External model / effects</text><rect x="1182" y="218" width="294" height="118" rx="11" fill="#fff" stroke="#e5c899" stroke-width="1.5"/><text x="1198" y="245" class="nodehead" >Direct Anthropic API</text><text x="1198" y="268" class="small" >HTTPS; minimal evidence package</text><text x="1198" y="289" class="small" >No credentials or tool authority</text><text x="1198" y="310" class="small" >Usage is reconciled to the job budget</text><rect x="1182" y="365" width="294" height="101" rx="11" fill="#fff" stroke="#e5c899" stroke-width="1.5"/><text x="1198" y="391" class="nodehead" >Validated publication gate</text><text x="1198" y="414" class="small" >Human review per policy</text><text x="1198" y="434" class="small" >fresh source + idempotency</text><text x="1198" y="454" class="small" >no AI-only merge blocking</text><rect x="1182" y="492" width="294" height="73" rx="11" fill="#fff0dc"/><text x="1198" y="516" class="nodehead" fill="#8d5a1c">Provider trust boundary</text><text x="1198" y="539" class="small" fill="#8d5a1c">Approved data-processing policy required</text><path d="M234 273 H323" fill="none" stroke="#bd762b" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearr)/><path d="M453 267 H635" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)/><path d="M765 267 H942" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)/><path d="M1072 267 H1182" fill="none" stroke="#bd762b" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearr)/><path d="M820 391 H895" fill="none" stroke="#008c84" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarr)/><path d="M1119 510 H1182" fill="none" stroke="#008c84" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarr)/><text x="28" y="668" class="zone" >REQUIRED INVARIANTS</text><rect x="28" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="50" cy="714" r="11" fill="#e8eff9"/><text x="50" y="718" class="tag" text-anchor="middle" fill="#38557b">1</text><text x="70" y="716" class="small" >Caller identity and every</text><text x="70" y="735" class="small" >artifact reference are authorized</text><text x="70" y="754" class="small" >server-side.</text><rect x="324" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="346" cy="714" r="11" fill="#e8eff9"/><text x="346" y="718" class="tag" text-anchor="middle" fill="#38557b">2</text><text x="366" y="716" class="small" >Evidence cites the immutable</text><text x="366" y="735" class="small" >source version used for</text><text x="366" y="754" class="small" >the assessment.</text><rect x="620" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="642" cy="714" r="11" fill="#e8eff9"/><text x="642" y="718" class="tag" text-anchor="middle" fill="#38557b">3</text><text x="662" y="716" class="small" >Model output is a</text><text x="662" y="735" class="small" >candidate; Go validation is</text><text x="662" y="754" class="small" >authoritative.</text><rect x="916" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="938" cy="714" r="11" fill="#e8eff9"/><text x="938" y="718" class="tag" text-anchor="middle" fill="#38557b">4</text><text x="958" y="716" class="small" >Provider calls share one</text><text x="958" y="735" class="small" >cumulative job budget and</text><text x="958" y="754" class="small" >deadline.</text><rect x="1212" y="692" width="278" height="77" rx="10" fill="#fff" stroke="#d8e1ed"/><circle cx="1234" cy="714" r="11" fill="#e8eff9"/><text x="1234" y="718" class="tag" text-anchor="middle" fill="#38557b">5</text><text x="1254" y="716" class="small" >External effects require freshness,</text><text x="1254" y="735" class="small" >authorization and idempotency.</text><text x="1254" y="754" class="small" ></text></svg>