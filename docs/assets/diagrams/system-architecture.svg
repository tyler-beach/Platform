.5-14.5c0-1.378 1.121-2.5 2.5-2.5s2.5 1.122 2.5 2.5S33.379 17 32 17a2.503 2.503 0 0 1-2.5-2.5M44 42H20v-2h6a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-6v-2h6a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-6v-2h24v4h2v-5a1 1 0 0 0-1-1H33v-1.121c2-.457 3.5-2.242 3.5-4.379 0-2.481-2.019-4.5-4.5-4.5a4.505 4.505 0 0 0-4.5 4.5c0 2.137 1.5 3.922 3.5 4.379V20H19a1 1 0 0 0-1 1v3h-7a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h7v2h-7a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h7v3a1 1 0 0 0 1 1h12v1.121c-2 .457-3.5 2.242-3.5 4.379 0 2.481 2.019 4.5 4.5 4.5s4.5-2.019 4.5-4.5c0-2.137-1.5-3.922-3.5-4.379V44h12a1 1 0 0 0 1-1v-5h-2z"/></g></g><text x="462" y="283" class="svctitle" text-anchor="middle">Step Functions</text><text x="462" y="300" class="svcsub" text-anchor="middle">job workflow</text></g><g><rect x="522" y="218" width="104" height="91" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><g transform="translate(553 225) scale(0.65625 0.65625)"><g fill="none" fill-rule="evenodd"><path fill="#7aa116" d="M0 0h64v64H0z"/><path fill="#fff" d="m47.759 33.948.234-1.817c2.173 1.254 2.849 1.99 3.044 2.293-.324.061-1.205.085-3.278-.476M30.499 21c-10.374 0-17.117-2.512-17.5-4.304v-.185c.35-1.119 6.14-4.51 17.5-4.51 11.34 0 17.133 3.38 17.5 4.504v.111C47.725 18.446 40.962 21 30.5 21m15.319 12.362c-4.765-1.565-10.906-4.383-13.224-5.474a2.09 2.09 0 0 0-2.082-1.982A2.097 2.097 0 0 0 28.418 28c0 1.154.94 2.094 2.094 2.094.457 0 .877-.152 1.22-.4 2.4 1.128 8.887 4.104 13.826 5.686l-1.721 13.344C43.583 50.352 38.919 52 30.497 52c-8.425 0-13.092-1.648-13.342-3.249l-3.72-28.937C16.945 21.915 23.749 23 30.5 23c6.75 0 13.554-1.085 17.065-3.185zM50 16.5c0-3.069-8.34-6.5-19.5-6.5S11 13.431 11 16.5v.543l4.174 31.99C15.874 53.516 26.123 54 30.497 54c4.372 0 14.616-.484 15.32-4.993l1.684-13.06c1.277.332 2.31.51 3.115.508.99 0 1.657-.252 2.08-.758.35-.416.489-.94.389-1.476-.228-1.22-1.682-2.509-4.715-4.177l-.1-.055L50 17.044z"/></g></g><text x="574" y="283" class="svctitle" text-anchor="middle">Amazon S3</text><text x="574" y="300" class="svcsub" text-anchor="middle">large artifacts</text></g><g><rect x="634" y="218" width="104" height="91" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/secrets-manager.svg" x="665" y="225" width="42" height="42"/><text x="686" y="283" class="svctitle" text-anchor="middle">Secrets Manager</text><text x="686" y="300" class="svcsub" text-anchor="middle">provider key</text></g><g><rect x="746" y="218" width="104" height="91" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/iam.svg" x="777" y="225" width="42" height="42"/><text x="798" y="283" class="svctitle" text-anchor="middle">IAM roles</text><text x="798" y="300" class="svcsub" text-anchor="middle">least privilege</text></g><g><rect x="858" y="218" width="104" height="91" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/kms.svg" x="889" y="225" width="42" height="42"/><text x="910" y="283" class="svctitle" text-anchor="middle">AWS KMS</text><text x="910" y="300" class="svcsub" text-anchor="middle">encryption</text></g><g><rect x="970" y="218" width="104" height="91" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/cloudwatch.svg" x="1001" y="225" width="42" height="42"/><text x="1022" y="283" class="svctitle" text-anchor="middle">CloudWatch</text><text x="1022" y="300" class="svcsub" text-anchor="middle">logs / metrics</text></g><g><rect x="1082" y="218" width="104" height="91" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/cloudtrail.svg" x="1113" y="225" width="42" height="42"/><text x="1134" y="283" class="svctitle" text-anchor="middle">CloudTrail</text><text x="1134" y="300" class="svcsub" text-anchor="middle">API audit</text></g><rect x="285" y="344" width="930" height="516" rx="18" fill="#f7faff" stroke="#8b69bd" stroke-width="2.2" stroke-dasharray="8 5"/><image href="../aws-icons/vpc.svg" x="301" y="352" width="31" height="31"/><text x="340" y="371" class="boundary" fill="#7251a5">TB-02 · VPC / PRIVATE NETWORK</text><text x="638" y="371" class="small" >Subnet layout and outbound route are deployment choices.</text><rect x="305" y="400" width="505" height="438" rx="14" fill="#eef5ff" stroke="#b7cce8"/><text x="322" y="423" class="zone" >APPLICATION / WORKER SEGMENT</text><rect x="823" y="400" width="195" height="438" rx="14" fill="#f0fbf8" stroke="#9fd7ca"/><text x="839" y="423" class="zone" >DATA SEGMENT</text><rect x="1030" y="400" width="168" height="438" rx="14" fill="#fff8ee" stroke="#e8c48e" stroke-dasharray="6 4"/><text x="1043" y="423" class="zone" fill="#95601d">EGRESS</text><g><rect x="328" y="492" width="220" height="100" rx="11" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><image href="../aws-icons/lambda.svg" x="338" y="502" width="38" height="38"/><text x="388" y="518" class="nodehead" >Admission / job API</text><text x="388" y="537" class="nodecopy" >authorize caller + workspace</text><text x="388" y="552" class="nodecopy" >validate, canonicalize, deduplicate</text></g><g><rect x="568" y="492" width="220" height="100" rx="11" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><image href="../aws-icons/lambda.svg" x="578" y="502" width="38" height="38"/><text x="628" y="518" class="nodehead" >Dispatch reconciler</text><text x="628" y="537" class="nodecopy" >claim durable dispatch intent</text><text x="628" y="552" class="nodecopy" >start workflow; reconcile ambiguity</text></g><rect x="325" y="643" width="468" height="174" rx="12" fill="#fff" stroke="#cbd9e8" stroke-width="1.4"/><text x="340" y="664" class="zone" >STEP FUNCTIONS TASKS · GO LAMBDA</text><rect x="337" y="681" width="143" height="122" rx="9" fill="#f8fbff" stroke="#d7e1ee"/><image href="../aws-icons/lambda.svg" x="345" y="690" width="30" height="30"/><text x="380" y="706" class="nodehead" font-size="10.5">Normalize + retrieve</text><text x="346" y="742" class="nodecopy" >pin revisions</text><text x="346" y="760" class="nodecopy" >resolve applicable ADR</text><rect x="488" y="681" width="143" height="122" rx="9" fill="#f8fbff" stroke="#d7e1ee"/><image href="../aws-icons/lambda.svg" x="496" y="690" width="30" height="30"/><text x="531" y="706" class="nodehead" font-size="10.5">Evidence assembly</text><text x="497" y="742" class="nodecopy" >diff / symbols / rules</text><text x="497" y="760" class="nodecopy" >track completeness</text><rect x="639" y="681" width="143" height="122" rx="9" fill="#f8fbff" stroke="#d7e1ee"/><image href="../aws-icons/lambda.svg" x="647" y="690" width="30" height="30"/><text x="682" y="706" class="nodehead" font-size="10.5">Assess + validate</text><text x="648" y="742" class="nodecopy" >bounded provider call</text><text x="648" y="760" class="nodecopy" >verify IDs, hashes, scope</text><path d="M480 744 H488" fill="none" stroke="#526783" stroke-width="1.8"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M631 744 H639" fill="none" stroke="#526783" stroke-width="1.8"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="842" y="500" width="157" height="125" rx="11" fill="#fff" stroke="#9acfc4" stroke-width="1.5"/><image href="../aws-icons/aurora.svg" x="855" y="512" width="43" height="43"/><text x="905" y="531" class="nodehead" >Aurora PostgreSQL</text><text x="855" y="568" class="nodecopy" >jobs • idempotency</text><text x="855" y="585" class="nodecopy" >dispatch • findings</text><text x="855" y="602" class="nodecopy" >evidence • budget • audit</text><text x="840" y="655" class="small" >TLS + scoped DB role</text><text x="840" y="676" class="small" >Source blobs → S3 when large</text><rect x="1041" y="553" width="147" height="159" rx="11" fill="#fff" stroke="#d5aa6b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1054" y="578" class="nodehead" fill="#8d5a1c">Route decision</text><text x="1054" y="603" class="nodecopy" >NAT / proxy /</text><text x="1054" y="619" class="nodecopy" >allowlist TBD</text><text x="1054" y="650" class="nodecopy" >HTTPS outbound</text><text x="1054" y="669" class="nodecopy" >minimum evidence</text><text x="1054" y="690" class="nodecopy" >no model tool access</text><rect x="1260" y="560" width="230" height="218" rx="16" fill="#fff" stroke="#bd762b" stroke-width="2.2" stroke-dasharray="7 5"/><text x="1278" y="586" class="tag" fill="#995f1e">TB-03 · THIRD-PARTY</text><circle cx="1296" cy="620" r="11" fill="#d97757"/><circle cx="1320" cy="620" r="11" fill="#e3aa68"/><circle cx="1344" cy="620" r="11" fill="#8d7bd2"/><text x="1278" y="659" class="nodehead" >Anthropic API</text><text x="1278" y="681" class="copy" >Direct provider API</text><text x="1278" y="705" class="small" fill="#995f1e">No Amazon Bedrock path</text><line x1="1278" y1="720" x2="1470" y2="720" stroke="#e8d6bc"/><text x="1278" y="743" class="small" >Only selected evidence</text><text x="1278" y="760" class="small" >and required context</text><rect x="285" y="875" width="930" height="43" rx="9" fill="#edf2f8" stroke="#d6e0ec"/><text x="300" y="893" class="zone" >CROSS-CUTTING</text><text x="402" y="893" class="small" >IAM scopes each worker; Secrets Manager supplies credentials; KMS controls encryption; CloudTrail and CloudWatch serve distinct audit/ops needs.</text><text x="402" y="909" class="small" >Business audit, result provenance, reviewer decisions and spend ledger live in Aurora—not ordinary logs.</text><path d="M30 966 H78" fill="none" stroke="#526783" stroke-width="2.3"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="90" y="970" class="small" >Request / service flow</text><path d="M290 966 H338" fill="none" stroke="#008c84" stroke-width="2.3"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarr)"/><text x="350" y="970" class="small" >Durable state / evidence</text><path d="M578 966 H626" fill="none" stroke="#bd762b" stroke-width="2.3" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearr)"/><text x="638" y="970" class="small" >External / unresolved route</text><rect x="891" y="955" width="42" height="22" rx="5" fill="none" stroke="#8b69bd" stroke-width="2" stroke-dasharray="5 3"/><text x="943" y="970" class="small" >Trust / network boundary</text><text x="30" y="1015" class="small" >Open choices to resolve: ingress profile; VPC/AZ topology; trigger for dispatch reconciliation; outbound egress; key ownership; artifact retention.</text></svg>