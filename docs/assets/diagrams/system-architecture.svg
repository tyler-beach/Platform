</style></defs><rect width="1520" height="1040" fill="url(#bg)"/><text x="30" y="36" class="kicker" >ADR DEVIATION PLATFORM  /  SYSTEM ARCHITECTURE</text><text x="30" y="75" class="title" >AWS deployment architecture</text><text x="30" y="103" class="subtitle" >Pinned source versions, durable orchestration, bounded assessment, validated findings</text><rect x="25" y="205" width="218" height="205" rx="15" fill="#fff" stroke="#c77e52" stroke-width="2" stroke-dasharray="7 5"/><text x="43" y="231" class="tag" fill="#995a34">TB-01 · SOURCE TRUST</text><circle cx="65" cy="265" r="14" fill="#e8eff8" stroke="#bac9db"/><circle cx="65" cy="260" r="4" fill="#617891"/><path d="M56 275 Q65 265 74 275" fill="none" stroke="#617891" stroke-width="2.5" stroke-linecap="round"/><text x="88" y="269" class="nodehead" >Developer / CI</text><rect x="43" y="294" width="29" height="34" rx="4" fill="#eef4fa" stroke="#8ca3bf"/><path d="M49 303h17M49 310h17M49 317h12" stroke="#8ca3bf" stroke-width="2"/><text x="83" y="306" class="copy" >GitHub change / webhook</text><text x="83" y="324" class="small" >or supplied diff + ADR</text><text x="43" y="354" class="small" >Signed event or authenticated API</text><text x="43" y="375" class="small" fill="#995a34">Source text stays untrusted data.</text><rect x="265" y="128" width="970" height="811" rx="21" fill="#fff" stroke="#5477a3" stroke-width="2.8"/><g transform="translate(285 142) scale(0.8 0.8)"><g fill="none" fill-rule="evenodd"><path fill="#242f3e" d="M0 0h40v40H0z"/><path fill="#fff" d="m28.993 27.995-17.506-.019c-2.366-.002-4.333-1.847-4.475-4.2A6 6 0 0 1 7 23.396c0-3.098 2.091-4.11 3.337-4.438a.5.5 0 0 0 .37-.54 7 7 0 0 1-.048-.823c0-2.464 1.649-5.114 3.756-6.033.944-.413 1.817-.577 2.608-.577 2.253 0 3.844 1.33 4.538 2.047.768.793 1.366 1.805 1.779 3.01a.498.498 0 0 0 .879.128c.588-.82 1.547-1.189 2.44-.932 1.123.321 1.857 1.488 1.961 3.068a.5.5 0 0 0 .407.57C30.222 19.09 33 19.957 33 23.44c0 4.15-3.886 4.542-4.007 4.555m.601-10.02c-.215-1.