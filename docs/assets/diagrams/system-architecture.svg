<g><circle cx="75" cy="207" r="9" fill="#4057ae"/><text x="94" y="212" class="h2">Code changes</text><text x="65" y="237" class="p">Pinned base/head revision</text><text x="65" y="254" class="p">Diff, symbols and config</text>
