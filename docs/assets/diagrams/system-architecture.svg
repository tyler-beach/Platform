<circle cx="75" cy="507" r="9" fill="#61718e"/><text x="94" y="512" class="h2">CI / integrations</text><text x="65" y="537" class="p">Webhook / future clients</text><text x="65" y="554" class="p">Untrusted at ingress</text>
<text x="65" y="620" class="tag" fill="#53648a">SOURCE RULE</text><text x="65" y="640" class="p">Branches are not snapshots.</text>
<text x="290" y="219" class="h2">API boundary</text><text x="290" y="243" class="p">HTTP serverless MVP or</text><text x="290" y="261" class="p">long-lived gRPC when needed</text><text x="290" y="281" class="p">Protocol ≠ workflow owner</text>
<text x="290" y="345" class="h2">Identity + admission</text><text x="290" y="369" class="p">AuthN / AuthZ per request</text><text x="290" y="387" class="p">Tenant + repo scope</text><text x="290" y="405" class="p">Quotas, sizes, deadlines</text>
<text x="290" y="475" class="h2">Idempotent acceptance</text><text x="290" y="499" class="p">Canonical request + key</text><text x="290" y="517" class="p">Job + durable dispatch intent</text><text x="290" y="535" class="p">Return job ID; don't wait</text>
<text x="290" y="604" class="h2">Dispatch reconciler</text><text x="290" y="625" class="p">Repairs DB / workflow gap</text><text x="290" y="643" class="p">Leases + duplicate-safe start</text>
<circle cx="532" cy="223" r="13" fill="#ffffff" fill-opacity=".2"/><path d="M526 223h12M532 217v12" stroke="#fff" stroke-width="2"/><text x="553" y="225" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="750" fill="#fff">Step Functions</text><text x="526" y="258" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#e6ebff">Durable async lifecycle</text><text x="526" y="278" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#e6ebff">Branches + retry/catch</text><text x="526" y="298" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#e6ebff">Deadlines + terminal states</text>
<text x="525" y="378" class="h2">Fan-out / fan-in</text><text x="525" y="401" class="p">Retrieval + deterministic checks</text><text x="525" y="419" class="p">Branch completeness policy</text><text x="525" y="437" class="p">Partial failure is explicit</text>
<text x="525" y="501" class="h2">Small workflow state</text><text x="525" y="524" class="p">IDs / hashes / status only</text><text x="525" y="542" class="p">Large content in object storage</text>
<text x="525" y="623" class="h2">Replay safely</text><text x="525" y="646" class="p">At-least-once, not exactly-once</text>
<text x="762" y="207" class="h2">Deterministic Go workers</text><text x="762" y="232" class="p">Normalize source + offset maps</text><text x="762" y="251" class="p">Resolve status, scope, relationships</text><text x="762" y="270" class="p">Diff / AST / symbol / document rules</text><text x="762" y="289" class="p">Counter-evidence + canonical ordering</text>
<text x="762" y="360" class="h2">Evidence package + AI harness</text><text x="762" y="385" class="p">Immutable refs + prompt/schema version</text><text x="762" y="404" class="p">Token preflight + reserved output tokens</text><text x="762" y="423" class="p">Job spend / calls / retries / deadline caps</text><text x="762" y="442" class="p">Named operation; no open-ended tool loop</text><text x="762" y="461" class="p">Direct Anthropic SDK — explicit side effect</text>
<text x="762" y="530" class="h2">Application validation</text><text x="762" y="553" class="p">Schema + evidence IDs/versions/locators</text><text x="762" y="572" class="p">Applicability + contradiction + policy</text>
<text x="762" y="644" class="h2">Review + controlled publication</text>
<text x="1170" y="210" class="h2">PostgreSQL</text><text x="1165" y="237" class="p">Jobs + idempotency/outbox</text><text x="1165" y="256" class="p">Findings + reviews + audit</text><text x="1165" y="275" class="p">Model run + usage ledger</text><text x="1165" y="294" class="p">Authoritative business state</text>
<text x="1170" y="350" class="h2">S3 snapshots</text><text x="1165" y="377" class="p">Immutable versioned source</text><text x="1165" y="396" class="p">Hash, retention, lifecycle</text>
<text x="1170" y="452" class="h2">Secrets Manager</text><text x="1165" y="479" class="p">IAM-limited API credentials</text><text x="1165" y="498" class="p">Rotation + no prompt/log leak</text>
<text x="1170" y="555" class="h2">OpenTelemetry</text><text x="1165" y="580" class="p">Correlated, redacted telemetry</text><text x="1165" y="596" class="p">Not the audit system of record</text>
<text x="1165" y="647" class="tag" fill="#96571c">ANTHROPIC API · BOUNDED CALL</text>
