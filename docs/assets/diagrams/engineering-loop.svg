<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 500" role="img" aria-labelledby="title desc">
<title id="title">OpenSpec engineering lifecycle</title><desc id="desc">Seven-stage delivery loop from approved scope and behavioral scenarios through test-first implementation, layered verification, adversarial review and archive.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526783"/></marker>
<marker id="tealarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#008c84"/></marker>
<style>
.kicker{font:800 13px Arial,system-ui,sans-serif;letter-spacing:1.8px;fill:#61748e}
.title{font:750 31px Arial,system-ui,sans-serif;letter-spacing:-.4px;fill:#152744}
.subtitle{font:400 16px Arial,system-ui,sans-serif;fill:#61748e}
.zone{font:800 11.5px Arial,system-ui,sans-serif;letter-spacing:1px;fill:#52657e}
.nodehead{font:750 13px Arial,system-ui,sans-serif;fill:#162b48}
.nodecopy{font:500 10.5px Arial,system-ui,sans-serif;fill:#62748d}
.copy{font:500 13px Arial,system-ui,sans-serif;fill:#465d79}
.small{font:500 11.5px Arial,system-ui,sans-serif;fill:#637791}
.tag{font:800 10.5px Arial,system-ui,sans-serif;letter-spacing:.55px}
</style></defs><rect width="1320" height="500" fill="url(#bg)"/><text x="28" y="37" class="kicker" >DELIVERY MODEL  /  REQUIREMENTS TO EVIDENCE</text><text x="28" y="76" class="title" >Change only when the behavior is testable</text><text x="28" y="103" class="subtitle" >OpenSpec defines the change; verification and review evidence complete it.</text><rect x="25" y="185" width="164" height="156" rx="12" fill="#fff" stroke="#d1deeb" stroke-width="1.5"/><circle cx="48" cy="211" r="13" fill="#e6effb"/><text x="48" y="215" class="tag" text-anchor="middle" fill="#38557b">01</text><text x="39" y="246" class="nodehead" >Define</text><text x="39" y="274" class="nodecopy" >Proposal + decisions</text><text x="39" y="295" class="nodecopy" >Scope, goals, non-goals</text><path d="M189 260 H207" fill="none" stroke="#526783" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="208" y="185" width="164" height="156" rx="12" fill="#fff" stroke="#d1deeb" stroke-width="1.5"/><circle cx="231" cy="211" r="13" fill="#e6effb"/><text x="231" y="215" class="tag" text-anchor="middle" fill="#38557b">02</text><text x="222" y="246" class="nodehead" >Specify</text><text x="222" y="274" class="nodecopy" >Given / When / Then</text><text x="222" y="295" class="nodecopy" >Observable behavior</text><path d="M372 260 H390" fill="none" stroke="#526783" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="391" y="185" width="164" height="156" rx="12" fill="#fff" stroke="#d1deeb" stroke-width="1.5"/><circle cx="414" cy="211" r="13" fill="#e6effb"/><text x="414" y="215" class="tag" text-anchor="middle" fill="#38557b">03</text><text x="405" y="246" class="nodehead" >Prove failure</text><text x="405" y="274" class="nodecopy" >Regression / contract test</text><text x="405" y="295" class="nodecopy" >Expected RED before code</text><path d="M555 260 H573" fill="none" stroke="#526783" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="574" y="185" width="164" height="156" rx="12" fill="#fff" stroke="#d1deeb" stroke-width="1.5"/><circle cx="597" cy="211" r="13" fill="#e6effb"/><text x="597" y="215" class="tag" text-anchor="middle" fill="#38557b">04</text><text x="588" y="246" class="nodehead" >Implement</text><text x="588" y="274" class="nodecopy" >Small reviewed change</text><text x="588" y="295" class="nodecopy" >Keep domain logic pure</text><path d="M738 260 H756" fill="none" stroke="#526783" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="757" y="185" width="164" height="156" rx="12" fill="#fff" stroke="#d1deeb" stroke-width="1.5"/><circle cx="780" cy="211" r="13" fill="#e6effb"/><text x="780" y="215" class="tag" text-anchor="middle" fill="#38557b">05</text><text x="771" y="246" class="nodehead" >Verify</text><text x="771" y="274" class="nodecopy" >Unit, integration, security</text><text x="771" y="295" class="nodecopy" >CI + labeled evaluations</text><path d="M921 260 H939" fill="none" stroke="#526783" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="940" y="185" width="164" height="156" rx="12" fill="#fff" stroke="#d1deeb" stroke-width="1.5"/><circle cx="963" cy="211" r="13" fill="#e6effb"/><text x="963" y="215" class="tag" text-anchor="middle" fill="#38557b">06</text><text x="954" y="246" class="nodehead" >Challenge</text><text x="954" y="274" class="nodecopy" >Adversarial review</text><text x="954" y="295" class="nodecopy" >Failures, budgets, access</text><path d="M1104 260 H1122" fill="none" stroke="#526783" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="1123" y="185" width="164" height="156" rx="12" fill="#fff" stroke="#d1deeb" stroke-width="1.5"/><circle cx="1146" cy="211" r="13" fill="#e6effb"/><text x="1146" y="215" class="tag" text-anchor="middle" fill="#38557b">07</text><text x="1137" y="246" class="nodehead" >Archive</text><text x="1137" y="274" class="nodecopy" >Record verified result</text><text x="1137" y="295" class="nodecopy" >Close traceability loop</text><rect x="25" y="382" width="1268" height="86" rx="12" fill="#f2f6fc" stroke="#d7e1ee"/><text x="45" y="408" class="zone" >TRACEABILITY RECORD</text><text x="45" y="435" class="copy" >Every requirement links to a scenario; every scenario links to a test or evaluation; every release gate links to evidence and an owner.</text><text x="45" y="456" class="small" >A documented control is not a passed control. Unrun tests and unresolved decisions stay visible.</text><path d="M1200 341 V364 H106 V382" fill="none" stroke="#008c84" stroke-width="2.2" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarr)"/><text x="520" y="365" class="small" >Failing proof or uncovered risk returns the change to specification or implementation.</text></svg>