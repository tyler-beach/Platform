<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d"><title id="t">OpenSpec-first engineering and test-driven delivery loop</title><desc id="d">A traceable change lifecycle: proposal, Given-When-Then behavior scenarios, design and risk review, failing tests, functional-core implementation, adapters, multiple verification layers and reviewed OpenSpec archival.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8291ae"/></marker><style>.k{font:750 12px Inter,system-ui,sans-serif;letter-spacing:1.6px;fill:#61708e}.h{font:750 27px Inter,system-ui,sans-serif;fill:#18294d}.s{font:400 14px Inter,system-ui,sans-serif;fill:#60708b}.t{font:700 14px Inter,system-ui,sans-serif;fill:#1b2b4f}.p{font:400 11px Inter,system-ui,sans-serif;fill:#5e6e87}.tag{font:750 9px Inter,system-ui,sans-serif;letter-spacing:.5px}.ln{fill:none;stroke:#8291ae;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1440" height="760" rx="22" fill="url(#bg)"/><text x="40" y="42" class="k">ENGINEERING SYSTEM / 03</text><text x="40" y="78" class="h">Specify behavior → prove it → implement → verify → archive</text><text x="40" y="104" class="s">Trace every accepted requirement through scenarios, tests, code, evaluation results and a release decision.</text>
<g>
<rect x="40" y="145" width="320" height="155" rx="15" fill="#fff" stroke="#cbd7f1"/><rect x="40" y="145" width="320" height="8" rx="4" fill="#4057ae"/><circle cx="68" cy="181" r="14" fill="#e7edff"/><path d="M60 181h16M68 173v16" stroke="#4057ae" stroke-width="2"/><text x="92" y="183" class="t">1 / OpenSpec proposal</text><text x="62" y="216" class="p">Outcome, scope, non-goals, risks,</text><text x="62" y="235" class="p">alternatives, migrations and rollback.</text><text x="62" y="254" class="p">Mark unknown policy choices for humans.</text><text x="62" y="282" class="tag" fill="#4057ae">REVIEW SCOPE BEFORE CODE</text>
<rect x="390" y="145" width="320" height="155" rx="15" fill="#fff" stroke="#bfe3db"/><rect x="390" y="145" width="320" height="8" rx="4" fill="#17877f"/><circle cx="418" cy="181" r="14" fill="#ddf5ef"/><path d="M411 174h14v14h-14zM414 179h8M414 183h8" fill="none" stroke="#17877f" stroke-width="1.5"/><text x="442" y="183" class="t">2 / Behavioral specification</text><text x="412" y="216" class="p">Normative requirements with explicit scope.</text><text x="412" y="235" class="p">Given / When / Then observable outcomes.</text><text x="412" y="254" class="p">Include duplicate, denied, stale, partial,</text><text x="412" y="273" class="p">malicious and budget-exhausted scenarios.</text><text x="412" y="289" class="tag" fill="#17877f">REQUIREMENT ID → TEST ID</text>
<rect x="740" y="145" width="320" height="155" rx="15" fill="#fff" stroke="#d7deed"/><rect x="740" y="145" width="320" height="8" rx="4" fill="#70809e"/><circle cx="768" cy="181" r="14" fill="#eef1f7"/><path d="M761 181l5 5 9-11" fill="none" stroke="#70809e" stroke-width="2"/><text x="792" y="183" class="t">3 / Design + test plan</text><text x="762" y="216" class="p">Contracts, state transitions, effects,</text><text x="762" y="235" class="p">data lifecycle, security, failure matrix.</text><text x="762" y="254" class="p">Choose test levels and evaluation gates.</text><text x="762" y="282" class="tag" fill="#70809e">NO SILENT HIGH-IMPACT GUESSING</text>
<rect x="1090" y="145" width="310" height="155" rx="15" fill="#fff7e9" stroke="#eed3aa"/><rect x="1090" y="145" width="310" height="8" rx="4" fill="#c17a2f"/><circle cx="1118" cy="181" r="14" fill="#ffedcf"/><path d="M1118 173v10M1118 187v1" stroke="#b86c25" stroke-width="2"/><text x="1142" y="183" class="t">4 / Write failing tests</text><text x="1112" y="216" class="p">Reproduce the behavior/bug first.</text><text x="1112" y="235" class="p">Pin eval examples and evidence spans.</text><text x="1112" y="254" class="p">Prove tests fail for the expected reason.</text><text x="1112" y="282" class="tag" fill="#a05c1f">RED BEFORE IMPLEMENTATION</text>
<path d="M360 223H382" class="ln"/><path d="M710 223H732" class="ln"/><path d="M1060 223H1082" class="ln"/>
<rect x="1090" y="350" width="310" height="155" rx="15" fill="#fff" stroke="#bfe3db"/><rect x="1090" y="350" width="8" height="155" rx="4" fill="#17877f"/><circle cx="1126" cy="386" r="14" fill="#ddf5ef"/><path d="M1119 386h14M1126 379v14" stroke="#17877f" stroke-width="2"/><text x="1150" y="388" class="t">5 / Implement small slices</text><text x="1112" y="421" class="p">Pure Go domain core first.</text><text x="1112" y="440" class="p">Then adapters and effectful use cases.</text><text x="1112" y="459" class="p">Idempotent writes; typed errors; explicit</text><text x="1112" y="478" class="p">timeouts, budgets and cancellation.</text><text x="1112" y="494" class="tag" fill="#17877f">GREEN, THEN REFACTOR</text>
<rect x="740" y="350" width="320" height="155" rx="15" fill="#fff" stroke="#cbd7f1"/><rect x="740" y="350" width="8" height="155" rx="4" fill="#4057ae"/><circle cx="776" cy="386" r="14" fill="#e7edff"/><path d="M769 382h14v9h-14zM772 379h8" fill="none" stroke="#4057ae" stroke-width="1.5"/><text x="800" y="388" class="t">6 / Run layered verification</text><text x="762" y="421" class="p">Unit/property tests for pure invariants.</text><text x="762" y="440" class="p">API/Proto contracts and DB/workflow integration.</text><text x="762" y="459" class="p">Replay / retry / auth / races / cancellation.</text><text x="762" y="478" class="p">AI evaluations + security/dependency scans.</text><text x="762" y="494" class="tag" fill="#4057ae">REAL RESULTS, NOT ASSUMED</text>
<rect x="390" y="350" width="320" height="155" rx="15" fill="#fff" stroke="#d7deed"/><rect x="390" y="350" width="8" height="155" rx="4" fill="#70809e"/><circle cx="426" cy="386" r="14" fill="#eef1f7"/><path d="M419 386l5 5 9-11" fill="none" stroke="#70809e" stroke-width="2"/><text x="450" y="388" class="t">7 / Adversarial review</text><text x="412" y="421" class="p">Challenge trust boundaries and assumptions.</text><text x="412" y="440" class="p">Verify budget, stale data and partial failure.</text><text x="412" y="459" class="p">Review evidence correctness and outputs.</text><text x="412" y="478" class="p">Inspect logs for source / secret leakage.</text><text x="412" y="494" class="tag" fill="#70809e">REVIEW RISK, NOT JUST STYLE</text>
<rect x="40" y="350" width="320" height="155" rx="15" fill="#e4f6f0" stroke="#bfe3db"/><rect x="40" y="350" width="8" height="155" rx="4" fill="#17877f"/><circle cx="76" cy="386" r="14" fill="#fff"/><path d="M69 386l5 5 9-11" fill="none" stroke="#17877f" stroke-width="2"/><text x="100" y="388" class="t">8 / Release + archive</text><text x="62" y="421" class="p">Acceptance scenarios pass; specs match.</text><text x="62" y="440" class="p">Review quality/eval deltas and exceptions.</text><text x="62" y="459" class="p">Archive only after verification is done.</text><text x="62" y="478" class="p">Sync current-state specs to shipped behavior.</text><text x="62" y="494" class="tag" fill="#17877f">TRACEABILITY CLOSES THE LOOP</text>
<path d="M1245 300V340" class="ln"/><path d="M1090 427H1068" class="ln"/><path d="M740 427H718" class="ln"/><path d="M390 427H368" class="ln"/>
</g>
<path d="M200 505V547H1240V512" fill="none" stroke="#17877f" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="185" y="567" width="1070" height="78" rx="18" fill="#17294e"/><text x="720" y="596" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="750" fill="#fff">A change ships only with evidence that behavior is verified</text><text x="720" y="620" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" fill="#e0e8ff">Requirement ↔ Scenario ↔ Test ↔ Implementation ↔ Evaluation ↔ Release decision</text>
<text x="42" y="691" class="p">Exception policy: docs-only edits can use narrow validation. Behavioral, API/schema, retrieval, prompt, state-machine or security changes need a reviewed OpenSpec delta plus appropriate tests/evaluations.</text><text x="42" y="714" class="p">No test is “passed” because OpenSpec validates. No change is archived while required checks or acceptance scenarios remain unverified.</text></svg>