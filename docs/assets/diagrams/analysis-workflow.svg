</style></defs><rect width="1320" height="770" fill="url(#bg)"/><text x="28" y="37" class="kicker" >EXECUTION MODEL  /  ASYNCHRONOUS ANALYSIS</text><text x="28" y="76" class="title" >One job, one authoritative lifecycle</text><text x="28" y="103" class="subtitle" >Step Functions coordinates stages; Go validates domain outcomes before they become findings.</text><g><rect x="55" y="153" width="130" height="94" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><g transform="translate(99 160) scale(0.65625 0.65625)"><g fill="none" fill-rule="evenodd"><path fill="#e7157b" d="M0 0h64v64H0z"/><path fill="#fff" d="M37 34h15v-4H37zm16-6H36a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h17a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1M34.5 49.5c0 1.378-1.121 2.5-2.5 2.5a2.503 2.503 0 0 1-2.5-2.5c0-1.378 1.121-2.5 2.5-2.5s2.5 1.122 2.5 2.5M12 38v-3h13v3H12m0-9v-3h13v3zm17.5-14.5c0-1.378 1.121-2.5 2.5-2.5s2.5 1.122 2.5 2.5S33.379 17 32 17a2.503 2.503 0 0 1-2.5-2.5M44 42H20v-2h6a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-6v-2h6a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-6v-2h24v4h2v-5a1 1 0 0 0-1-1H33v-1.121c2-.457 3.5-2.242 3.5-4.379 0-2.481-2.019-4.5-4.5-4.5a4.505 4.505 0 0 0-4.5 4.5c0 2.137 1.5 3.922 3.5 4.379V20H19a1 1 0 0 0-1 1v3h-7a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h7v2h-7a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h7v3a1 1 0 0 0 1 1h12v1.121c-2 .457-3.5 2.242-3.5 4.379 0 2.481 2.019 4.5 4.5 4.5s4.5-2.019 4.5-4.5c0-2.137-1.5-3.922-3.5-4.379V44h12a1 1 0 0 0 1-1v-5h-2z"/></g></g><text x="120" y="218" class="svctitle" text-anchor="middle">Step Functions</text><text x="120" y="235" class="svcsub" text-anchor="middle">retry / catch / deadline</text></g><rect x="204" y="151" width="1075" height="94" rx="13" fill="#f2f6fc" stroke="#d8e2ef"/><text x="226" y="178" class="nodehead" >Persisted job context</text><text x="226" y="201" class="copy" >Job ID · immutable inputs · pipeline/prompt/schema versions · cumulative budget · stage status</text><text x="226" y="224" class="small" >State passed between tasks stays small; source artifacts and full evidence live in durable storage.</text><rect x="28" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="51" cy="315" r="13" fill="#e7eef8"/><text x="51" y="319" class="tag" text-anchor="middle" fill="#38557b">01</text><g transform="translate(162 300) scale(0.65625 0.65625)" fill="none"><path fill="#8c4fff" d="M0 0h64v64H0z"/><path fill="#fff" fill-rule="evenodd" d="M28 44h3v-2h-3zm5 0h3v-2h-3zm-5-22h3v-2h-3zm5 0h3v-2h-3zm-11-9.26-10 5.834v27.808l10 5zM24 20h2v2h-2v20h2v2h-2v9a1 1 0 0 1-1.447.895l-12-6A1 1 0 0 1 10 47V18a1 1 0 0 1 .496-.864l12-7A1.002 1.002 0 0 1 24 11zm28-1.426L42 12.74v38.641l10-5zM54 18v29c0 .379-.214.725-.553.895l-12 6a1 1 0 0 1-.972-.044A1 1 0 0 1 40 53v-9h-2v-2h2V22h-2v-2h2v-9a.998.998 0 0 1 1.504-.864l12 7A1 1 0 0 1 54 18m-19.061 9.342-1.878-.684-4 11 1.878.684zm4.768 5.365a1 1 0 0 0 0-1.414l-3-3-1.414 1.414L37.586 32l-2.293 2.293 1.414 1.414zm-12.414 3-3-3a1 1 0 0 1 0-1.414l3-3 1.414 1.414L26.414 32l2.293 2.293z" clip-rule="evenodd"/></g><text x="43" y="351" class="nodehead" >Admit</text><text x="43" y="381" class="nodecopy" >Authenticate</text><text x="43" y="399" class="nodecopy" >authorize + dedupe</text><rect x="239" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="262" cy="315" r="13" fill="#e7eef8"/><text x="262" y="319" class="tag" text-anchor="middle" fill="#38557b">02</text><image href="../aws-icons/lambda.svg" x="373" y="300" width="42" height="42"/><text x="254" y="351" class="nodehead" >Pin sources</text><text x="254" y="381" class="nodecopy" >Snapshot + hash</text><text x="254" y="399" class="nodecopy" >scope + version</text><rect x="450" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="473" cy="315" r="13" fill="#e7eef8"/><text x="473" y="319" class="tag" text-anchor="middle" fill="#38557b">03</text><image href="../aws-icons/lambda.svg" x="584" y="300" width="42" height="42"/><text x="465" y="351" class="nodehead" >Collect evidence</text><text x="465" y="381" class="nodecopy" >Diff / retrieval</text><text x="465" y="399" class="nodecopy" >branch completeness</text><rect x="661" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="684" cy="315" r="13" fill="#e7eef8"/><text x="684" y="319" class="tag" text-anchor="middle" fill="#38557b">04</text><image href="../aws-icons/lambda.svg" x="795" y="300" width="42" height="42"/><text x="676" y="351" class="nodehead" >Reserve budget</text><text x="676" y="381" class="nodecopy" >Input + output caps</text><text x="676" y="399" class="nodecopy" >job-wide concurrency</text><rect x="872" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="895" cy="315" r="13" fill="#e7eef8"/><text x="895" y="319" class="tag" text-anchor="middle" fill="#38557b">05</text><text x="887" y="351" class="nodehead" >Assess</text><text x="887" y="381" class="nodecopy" >Direct Anthropic call</text><text x="887" y="399" class="nodecopy" >structured candidate</text><rect x="1083" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="1106" cy="315" r="13" fill="#e7eef8"/><text x="1106" y="319" class="tag" text-anchor="middle" fill="#38557b">06</text><image href="../aws-icons/aurora.svg" x="1217" y="300" width="42" height="42"/><text x="1098" y="351" class="nodehead" >Validate + persist</text><text x="1098" y="381" class="nodecopy" >Resolve cited evidence</text><text x="1098" y="399" class="nodecopy" >commit outcome + audit</text><path d="M218 373 H231" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M429 373 H442" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M640 373 H653" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M851 373 H864" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1062 373 H1075" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="872" y="466" width="190" height="63" rx="10" fill="#fff8ee" stroke="#c87925" stroke-width="1.5" stroke-dasharray="6 4"/><text x="887" y="489" class="tag" fill="#995f1e">TB-03 · provider</text><text x="887" y="511" class="small" >Only minimum evidence crosses.</text><path d="M967 453 V466" fill="none" stroke="#bd762b" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearr)"/><rect x="28" y="558" width="830" height="135" rx="14" fill="#f1fbf8" stroke="#a9d9cf"/><text x="48" y="584" class="zone" fill="#087f77">VALID OUTCOMES</text><rect x="48" y="600" width="187" height="72" rx="9" fill="#fff" stroke="#cbe6df"/><text x="58" y="621" class="nodehead" >Supported deviation</text><text x="58" y="643" class="nodecopy" >Applicable ADR + supported conflict</text><rect x="249" y="600" width="187" height="72" rx="9" fill="#fff" stroke="#cbe6df"/><text x="259" y="621" class="nodehead" >No deviation found</text><text x="259" y="643" class="nodecopy" >Sufficient bounded evidence</text><text x="259" y="658" class="nodecopy" > no conflict</text><rect x="450" y="600" width="187" height="72" rx="9" fill="#fff" stroke="#cbe6df"/><text x="460" y="621" class="nodehead" >Inconclusive</text><text x="460" y="643" class="nodecopy" >Missing / contradictory required evidence</text><rect x="651" y="600" width="187" height="72" rx="9" fill="#fff" stroke="#cbe6df"/><text x="661" y="621" class="nodehead" >Technical failure</text><text x="661" y="643" class="nodecopy" >Execution could not complete</text><rect x="884" y="558" width="389" height="135" rx="14" fill="#fff" stroke="#cfdbe9"/><text x="904" y="584" class="zone" >REVIEW / PUBLICATION GATE</text><text x="904" y="609" class="copy" >Check exact source version and policy freshness.</text><text x="904" y="632" class="copy" >Human disposition where required; publish idempotently.</text><text x="904" y="655" class="copy" >Never convert missing evidence into compliance.</text><path d="M1178 453 V525 H1080 V558" fill="none" stroke="#008c84" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarr)"/><text x="28" y="739" class="small" >Required branches that fail force bounded recovery or an inconclusive result. Optional failures remain visible in the result.</text></svg>