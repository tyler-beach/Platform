<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 770" role="img" aria-labelledby="title desc">
<title id="title">Asynchronous analysis workflow</title><desc id="desc">Workflow from admission and immutable source pinning through parallel evidence work, cumulative budget preflight, direct Anthropic assessment, application-side validation, durable result storage and review.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526783"/></marker>
<marker id="tealarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#008c84"/></marker>
<marker id="orangearr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd762b"/></marker>
<style>
.kicker{font:800 13px Arial,system-ui,sans-serif;letter-spacing:1.8px;fill:#61748e}
.title{font:750 31px Arial,system-ui,sans-serif;letter-spacing:-.4px;fill:#152744}
.subtitle{font:400 16px Arial,system-ui,sans-serif;fill:#61748e}
.boundary{font:800 13px Arial,system-ui,sans-serif;letter-spacing:1.1px;fill:#304b70}
.zone{font:800 11.5px Arial,system-ui,sans-serif;letter-spacing:1px;fill:#52657e}
.svctitle{font:750 11.5px Arial,system-ui,sans-serif;fill:#1b2d49}
.svcsub{font:500 10px Arial,system-ui,sans-serif;fill:#6b7b91}
.nodehead{font:750 13px Arial,system-ui,sans-serif;fill:#162b48}
.nodecopy{font:500 10.5px Arial,system-ui,sans-serif;fill:#62748d}
.copy{font:500 13px Arial,system-ui,sans-serif;fill:#465d79}
.small{font:500 11.5px Arial,system-ui,sans-serif;fill:#637791}
.tiny{font:750 9.5px Arial,system-ui,sans-serif;letter-spacing:.25px;fill:#6a7b90}
.tag{font:800 10.5px Arial,system-ui,sans-serif;letter-spacing:.55px}
.flowlabel{font:700 10px Arial,system-ui,sans-serif;fill:#526783}
</style></defs><rect width="1320" height="770" fill="url(#bg)"/><text x="28" y="37" class="kicker" >EXECUTION MODEL  /  ASYNCHRONOUS ANALYSIS</text><text x="28" y="76" class="title" >One job, one authoritative lifecycle</text><text x="28" y="103" class="subtitle" >Step Functions coordinates stages; Go validates domain outcomes before they become findings.</text><g><rect x="55" y="153" width="130" height="94" rx="11" fill="#fff" stroke="#d4deeb" stroke-width="1.5" /><image href="../aws-icons/step-functions.svg" x="99" y="160" width="42" height="42"/><text x="120" y="218" class="svctitle" text-anchor="middle">Step Functions</text><text x="120" y="235" class="svcsub" text-anchor="middle">retry / catch / deadline</text></g><rect x="204" y="151" width="1075" height="94" rx="13" fill="#f2f6fc" stroke="#d8e2ef"/><text x="226" y="178" class="nodehead" >Persisted job context</text><text x="226" y="201" class="copy" >Job ID · immutable inputs · pipeline/prompt/schema versions · cumulative budget · stage status</text><text x="226" y="224" class="small" >State passed between tasks stays small; source artifacts and full evidence live in durable storage.</text><rect x="28" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="51" cy="315" r="13" fill="#e7eef8"/><text x="51" y="319" class="tag" text-anchor="middle" fill="#38557b">01</text><image href="../aws-icons/api-gateway.svg" x="162" y="300" width="42" height="42"/><text x="43" y="351" class="nodehead" >Admit</text><text x="43" y="381" class="nodecopy" >Authenticate</text><text x="43" y="399" class="nodecopy" >authorize + dedupe</text><rect x="239" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="262" cy="315" r="13" fill="#e7eef8"/><text x="262" y="319" class="tag" text-anchor="middle" fill="#38557b">02</text><image href="../aws-icons/lambda.svg" x="373" y="300" width="42" height="42"/><text x="254" y="351" class="nodehead" >Pin sources</text><text x="254" y="381" class="nodecopy" >Snapshot + hash</text><text x="254" y="399" class="nodecopy" >scope + version</text><rect x="450" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="473" cy="315" r="13" fill="#e7eef8"/><text x="473" y="319" class="tag" text-anchor="middle" fill="#38557b">03</text><image href="../aws-icons/lambda.svg" x="584" y="300" width="42" height="42"/><text x="465" y="351" class="nodehead" >Collect evidence</text><text x="465" y="381" class="nodecopy" >Diff / retrieval</text><text x="465" y="399" class="nodecopy" >branch completeness</text><rect x="661" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="684" cy="315" r="13" fill="#e7eef8"/><text x="684" y="319" class="tag" text-anchor="middle" fill="#38557b">04</text><image href="../aws-icons/lambda.svg" x="795" y="300" width="42" height="42"/><text x="676" y="351" class="nodehead" >Reserve budget</text><text x="676" y="381" class="nodecopy" >Input + output caps</text><text x="676" y="399" class="nodecopy" >job-wide concurrency</text><rect x="872" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="895" cy="315" r="13" fill="#e7eef8"/><text x="895" y="319" class="tag" text-anchor="middle" fill="#38557b">05</text><text x="887" y="351" class="nodehead" >Assess</text><text x="887" y="381" class="nodecopy" >Direct Anthropic call</text><text x="887" y="399" class="nodecopy" >structured candidate</text><rect x="1083" y="293" width="190" height="160" rx="13" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="1106" cy="315" r="13" fill="#e7eef8"/><text x="1106" y="319" class="tag" text-anchor="middle" fill="#38557b">06</text><image href="../aws-icons/aurora.svg" x="1217" y="300" width="42" height="42"/><text x="1098" y="351" class="nodehead" >Validate + persist</text><text x="1098" y="381" class="nodecopy" >Resolve cited evidence</text><text x="1098" y="399" class="nodecopy" >commit outcome + audit</text><path d="M218 373 H231" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M429 373 H442" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M640 373 H653" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M851 373 H864" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1062 373 H1075" fill="none" stroke="#526783" stroke-width="2.5"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="872" y="466" width="190" height="63" rx="10" fill="#fff8ee" stroke="#c87925" stroke-width="1.5" stroke-dasharray="6 4"/><text x="887" y="489" class="tag" fill="#995f1e">TB-03 · provider</text><text x="887" y="511" class="small" >Only minimum evidence crosses.</text><path d="M967 453 V466" fill="none" stroke="#bd762b" stroke-width="2.2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearr)"/><rect x="28" y="558" width="830" height="135" rx="14" fill="#f1fbf8" stroke="#a9d9cf"/><text x="48" y="584" class="zone" fill="#087f77">VALID OUTCOMES</text><rect x="48" y="600" width="187" height="72" rx="9" fill="#fff" stroke="#cbe6df"/><text x="58" y="621" class="nodehead" >Supported deviation</text><text x="58" y="643" class="nodecopy" >Applicable ADR + supported conflict</text><rect x="249" y="600" width="187" height="72" rx="9" fill="#fff" stroke="#cbe6df"/><text x="259" y="621" class="nodehead" >No deviation found</text><text x="259" y="643" class="nodecopy" >Sufficient bounded evidence</text><text x="259" y="658" class="nodecopy" > no conflict</text><rect x="450" y="600" width="187" height="72" rx="9" fill="#fff" stroke="#cbe6df"/><text x="460" y="621" class="nodehead" >Inconclusive</text><text x="460" y="643" class="nodecopy" >Missing / contradictory required evidence</text><rect x="651" y="600" width="187" height="72" rx="9" fill="#fff" stroke="#cbe6df"/><text x="661" y="621" class="nodehead" >Technical failure</text><text x="661" y="643" class="nodecopy" >Execution could not complete</text><rect x="884" y="558" width="389" height="135" rx="14" fill="#fff" stroke="#cfdbe9"/><text x="904" y="584" class="zone" >REVIEW / PUBLICATION GATE</text><text x="904" y="609" class="copy" >Check exact source version and policy freshness.</text><text x="904" y="632" class="copy" >Human disposition where required; publish idempotently.</text><text x="904" y="655" class="copy" >Never convert missing evidence into compliance.</text><path d="M1178 453 V525 H1080 V558" fill="none" stroke="#008c84" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarr)"/><text x="28" y="739" class="small" >Required branches that fail force bounded recovery or an inconclusive result. Optional failures remain visible in the result.</text></svg>