<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 970" role="img" aria-labelledby="t d"><title id="t">Analysis workflow and control gates</title><desc id="d">A four-stage workflow with admission, source pinning, parallel evidence branches, token budget preflight, structured model assessment, semantic validation, atomic result persistence, review and freshness-safe publication. Failure paths are typed and bounded.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8190ac"/></marker><style>.k{font:750 12px Inter,system-ui,sans-serif;letter-spacing:1.6px;fill:#61708e}.h{font:750 27px Inter,system-ui,sans-serif;fill:#18294d}.sub{font:400 14px Inter,system-ui,sans-serif;fill:#60708b}.phase{font:750 11px Inter,system-ui,sans-serif;letter-spacing:1.2px;fill:#53648a}.title{font:700 14px Inter,system-ui,sans-serif;fill:#1b2b4f}.p{font:400 11px Inter,system-ui,sans-serif;fill:#5e6e87}.tag{font:750 9px Inter,system-ui,sans-serif;letter-spacing:.5px}.ln{fill:none;stroke:#8190ac;stroke-width:2;marker-end:url(#a)}.dash{fill:none;stroke:#bf7a39;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#a)}</style></defs><rect width="1440" height="970" rx="22" fill="url(#bg)"/><text x="40" y="42" class="k">JOB LIFECYCLE / 02</text><text x="40" y="78" class="h">From accepted request to defensible finding</text><text x="40" y="104" class="sub">No gate skipped silently; uncertainty and technical failure have different outcomes.</text>
<rect x="35" y="132" width="1370" height="155" rx="16" fill="#eaf0ff" stroke="#d2dcf5"/><rect x="35" y="305" width="1370" height="180" rx="16" fill="#e8f7f3" stroke="#c0e4dd"/><rect x="35" y="503" width="1370" height="190" rx="16" fill="#fff6e9" stroke="#f0dfc5"/><rect x="35" y="711" width="1370" height="190" rx="16" fill="#f0f3fa" stroke="#d8dfec"/>
<text x="55" y="156" class="phase">A / ACCEPT AND PIN INPUTS</text><text x="55" y="329" class="phase">B / BUILD VERSIONED EVIDENCE</text><text x="55" y="527" class="phase">C / BOUNDED MODEL ASSESSMENT</text><text x="55" y="735" class="phase">D / COMMIT, REVIEW AND PUBLISH</text>
<g>
<rect x="58" y="176" width="240" height="85" rx="12" fill="#fff" stroke="#cbd7f0"/><circle cx="80" cy="198" r="12" fill="#4057ae"/><text x="80" y="202" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">1</text><text x="100" y="201" class="title">Authorize + validate</text><text x="74" y="225" class="p">Tenant, source, size, rate, schema</text><text x="74" y="244" class="p">Forbidden scope fails closed</text>
<rect x="335" y="176" width="270" height="85" rx="12" fill="#fff" stroke="#cbd7f0"/><circle cx="357" cy="198" r="12" fill="#4057ae"/><text x="357" y="202" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">2</text><text x="377" y="201" class="title">Idempotent job + dispatch intent</text><text x="351" y="225" class="p">Canonical request fingerprint + key</text><text x="351" y="244" class="p">DB commit; reconciler starts workflow</text>
<rect x="642" y="176" width="270" height="85" rx="12" fill="#fff" stroke="#cbd7f0"/><circle cx="664" cy="198" r="12" fill="#4057ae"/><text x="664" y="202" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">3</text><text x="684" y="201" class="title">Step Functions owns lifecycle</text><text x="658" y="225" class="p">One state machine, explicit retries</text><text x="658" y="244" class="p">Return job ID; no long synchronous wait</text>
<rect x="950" y="176" width="420" height="85" rx="12" fill="#fff" stroke="#cbd7f0"/><circle cx="972" cy="198" r="12" fill="#4057ae"/><text x="972" y="202" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">4</text><text x="992" y="201" class="title">Pin immutable snapshot</text><text x="966" y="225" class="p">Commit/revision, ADR/spec version, hashes, parser + policy versions</text><text x="966" y="244" class="p">Moving branch or stale locator never becomes silent evidence.</text><path d="M298 219H327" class="ln"/><path d="M605 219H634" class="ln"/><path d="M912 219H942" class="ln"/>
<rect x="58" y="354" width="250" height="100" rx="12" fill="#fff" stroke="#bfe2da"/><circle cx="80" cy="376" r="12" fill="#17877f"/><text x="80" y="380" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">5</text><text x="100" y="379" class="title">Normalize inputs</text><text x="74" y="404" class="p">Bound parsers; map offsets</text><text x="74" y="423" class="p">Keep source integrity / locator</text><text x="74" y="442" class="p">Reject unsupported input</text>
<rect x="355" y="354" width="320" height="100" rx="12" fill="#fff" stroke="#bfe2da"/><circle cx="377" cy="376" r="12" fill="#17877f"/><text x="377" y="380" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">6</text><text x="397" y="379" class="title">Parallel deterministic branches</text><text x="371" y="404" class="p">Resolve decision status / scope / links</text><text x="371" y="423" class="p">Diff / AST / symbols / spec requirements</text><text x="371" y="442" class="p">Required vs optional failure is explicit</text>
<rect x="720" y="354" width="300" height="100" rx="12" fill="#fff" stroke="#bfe2da"/><circle cx="742" cy="376" r="12" fill="#17877f"/><text x="742" y="380" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">7</text><text x="762" y="379" class="title">Freeze evidence package</text><text x="736" y="404" class="p">Stable IDs and source versions</text><text x="736" y="423" class="p">Balanced support + counter-evidence</text><text x="736" y="442" class="p">Sort + deterministically select/truncate</text>
<rect x="1065" y="354" width="305" height="100" rx="12" fill="#dff5ef" stroke="#a8d9d0"/><text x="1087" y="380" class="title">Completeness gate</text><text x="1081" y="405" class="p">Required branch missing/stale?</text><text x="1081" y="424" class="p">Bounded retry or inconclusive state</text><text x="1081" y="443" class="p">Never claim complete analysis</text><path d="M308 404H347" class="ln"/><path d="M675 404H712" class="ln"/><path d="M1020 404H1057" class="ln"/>
<rect x="58" y="552" width="260" height="108" rx="12" fill="#fff" stroke="#eed8b9"/><circle cx="80" cy="574" r="12" fill="#b86c25"/><text x="80" y="578" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">8</text><text x="100" y="577" class="title">Budget preflight</text><text x="74" y="602" class="p">Count input; reserve max output</text><text x="74" y="621" class="p">Job cost/calls/retries/time caps</text><text x="74" y="640" class="p">Compact, route, or stop</text>
<path d="M355 606l63-44 63 44-63 44z" fill="#fff0d7" stroke="#dda66b" stroke-width="1.7"/><text x="418" y="601" text-anchor="middle" class="title">All limits</text><text x="418" y="618" text-anchor="middle" class="title">satisfied?</text>
<rect x="520" y="552" width="250" height="108" rx="12" fill="#fff" stroke="#eed8b9"/><circle cx="542" cy="574" r="12" fill="#b86c25"/><text x="542" y="578" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">9</text><text x="562" y="577" class="title">Structured assessment</text><text x="536" y="602" class="p">Named operation + prompt/schema</text><text x="536" y="621" class="p">Direct Anthropic, explicit effect</text><text x="536" y="640" class="p">Deadline, output cap, no tools</text>
<rect x="810" y="552" width="270" height="108" rx="12" fill="#fff" stroke="#eed8b9"/><circle cx="832" cy="574" r="12" fill="#b86c25"/><text x="832" y="578" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">10</text><text x="852" y="577" class="title">Validate in Go</text><text x="826" y="602" class="p">Schema + evidence ID/version</text><text x="826" y="621" class="p">Applicability + conflicts + policy</text><text x="826" y="640" class="p">Outcome ≠ severity ≠ review</text>
<rect x="1120" y="552" width="250" height="108" rx="12" fill="#fff" stroke="#eed8b9"/><text x="1142" y="579" class="title">Unsupported / invalid</text><text x="1136" y="604" class="p">Reject candidate; at most one</text><text x="1136" y="623" class="p">bounded repair where safe.</text><text x="1136" y="642" class="p">Otherwise typed error/inconclusive.</text>
<path d="M318 606H347" class="ln"/><path d="M481 606H512" class="ln"/><text x="485" y="591" class="tag" fill="#17877f">YES</text><path d="M418 562V540H188V544" class="dash"/><text x="210" y="538" class="tag" fill="#a45e21">NO → COMPACT / STOP</text><path d="M770 606H802" class="ln"/><path d="M1080 606H1112" class="ln"/>
<rect x="58" y="760" width="290" height="100" rx="12" fill="#fff" stroke="#d5ddeb"/><circle cx="80" cy="782" r="12" fill="#596c90"/><text x="80" y="786" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">11</text><text x="100" y="785" class="title">Persist validated result</text><text x="74" y="810" class="p">Finding + evidence + ModelRun</text><text x="74" y="829" class="p">Uniqueness + audit + usage ledger</text><text x="74" y="848" class="p">Transaction where possible</text>
<rect x="380" y="760" width="290" height="100" rx="12" fill="#fff" stroke="#d5ddeb"/><circle cx="402" cy="782" r="12" fill="#596c90"/><text x="402" y="786" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">12</text><text x="422" y="785" class="title">Review policy</text><text x="396" y="810" class="p">Ambiguous/high-impact → human</text><text x="396" y="829" class="p">Audit actor, disposition, rationale</text><text x="396" y="848" class="p">Unknown remains inconclusive</text>
<rect x="702" y="760" width="290" height="100" rx="12" fill="#fff" stroke="#d5ddeb"/><circle cx="724" cy="782" r="12" fill="#596c90"/><text x="724" y="786" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750" fill="#fff">13</text><text x="744" y="785" class="title">Freshness before publish</text><text x="718" y="810" class="p">Re-resolve pinned refs</text><text x="718" y="829" class="p">New source → revalidation marker</text><text x="718" y="848" class="p">Escape Markdown/HTML output</text>
<rect x="1024" y="760" width="346" height="100" rx="12" fill="#e1f5ef" stroke="#b5e2d8"/><text x="1048" y="785" class="title">Terminal state + telemetry</text><text x="1040" y="810" class="p">Persist attempts, timings, tokens, cost and trace IDs.</text><text x="1040" y="829" class="p">Redacted logs; durable audit; safe replay path.</text><text x="1040" y="848" class="p">Publication is idempotent, advisory by default.</text>
<path d="M348 810H372" class="ln"/><path d="M670 810H694" class="ln"/><path d="M992 810H1016" class="ln"/><path d="M1244 660V696H205V752" class="dash"/><text x="700" y="687" class="tag" fill="#a45e21">REJECT / INCOMPLETE → PERSIST TYPED OUTCOME, NOT FALSE SUCCESS</text>
<text x="42" y="925" class="p">RETRY RULE: retries share the original job deadline, token/cost cap and call allowance; external operations require idempotency and observable attempt records.</text></svg>