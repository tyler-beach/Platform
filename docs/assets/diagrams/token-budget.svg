<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="t d"><title id="t">LLM token and spend budget controls</title><desc id="d">Controls include a per-job hard cost cap, maximum model calls including retries/verification, overall deadline, tenant/global concurrency, token count/estimate, reserved output limit, provider usage reconciliation and explicit stop conditions.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8291ae"/></marker><style>.k{font:750 12px Inter,system-ui,sans-serif;letter-spacing:1.6px;fill:#61708e}.h{font:750 27px Inter,system-ui,sans-serif;fill:#18294d}.s{font:400 14px Inter,system-ui,sans-serif;fill:#60708b}.t{font:700 14px Inter,system-ui,sans-serif;fill:#1b2b4f}.p{font:400 11px Inter,system-ui,sans-serif;fill:#5e6e87}.tag{font:750 9px Inter,system-ui,sans-serif;letter-spacing:.5px}.ln{fill:none;stroke:#8291ae;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1440" height="760" rx="22" fill="url(#bg)"/><text x="40" y="42" class="k">AI RUNTIME / 04</text><text x="40" y="78" class="h">Token budgets are admission controls—not just context limits</text><text x="40" y="104" class="s">Every retry, repair, and optional verification call consumes the same cumulative job allowance.</text>
<rect x="35" y="132" width="1370" height="96" rx="15" fill="#17294e"/><text x="58" y="158" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="750" letter-spacing="1.2" fill="#dce6ff">HARD JOB ENVELOPE — ENFORCED BEFORE AND DURING EXECUTION</text>
<g font-family="Inter,system-ui,sans-serif"><rect x="58" y="174" width="245" height="38" rx="9" fill="#304776"/><text x="72" y="190" font-size="11" font-weight="700" fill="#fff">Spend ceiling</text><text x="72" y="204" font-size="9.5" fill="#dce6ff">input + output + attempts</text><rect x="315" y="174" width="245" height="38" rx="9" fill="#304776"/><text x="329" y="190" font-size="11" font-weight="700" fill="#fff">Call + retry ceiling</text><text x="329" y="204" font-size="9.5" fill="#dce6ff">assessment / repair / verify</text><rect x="572" y="174" width="245" height="38" rx="9" fill="#304776"/><text x="586" y="190" font-size="11" font-weight="700" fill="#fff">One wall-clock deadline</text><text x="586" y="204" font-size="9.5" fill="#dce6ff">never reset after retry</text><rect x="829" y="174" width="245" height="38" rx="9" fill="#304776"/><text x="843" y="190" font-size="11" font-weight="700" fill="#fff">Concurrency + quotas</text><text x="843" y="204" font-size="9.5" fill="#dce6ff">per tenant and global</text><rect x="1086" y="174" width="293" height="38" rx="9" fill="#4b3b51"/><text x="1100" y="190" font-size="11" font-weight="700" fill="#fff">Versioned price + model config</text><text x="1100" y="204" font-size="9.5" fill="#f1ddff">effective-dated configuration</text></g>
<g>
<rect x="42" y="268" width="238" height="125" rx="13" fill="#fff" stroke="#d4deee"/><circle cx="66" cy="291" r="11" fill="#e7edff"/><text x="66" y="295" text-anchor="middle" font-size="10" font-weight="750" fill="#4057ae">1</text><text x="85" y="294" class="t">Evidence package</text><text x="58" y="322" class="p">Immutable source IDs / locators</text><text x="58" y="341" class="p">Support + counter-evidence</text><text x="58" y="360" class="p">Minimal relevant excerpt only</text><text x="58" y="379" class="p">Canonical order, versioned policy</text>
<rect x="310" y="268" width="250" height="125" rx="13" fill="#fff" stroke="#bfe3db"/><circle cx="334" cy="291" r="11" fill="#ddf5ef"/><text x="334" y="295" text-anchor="middle" font-size="10" font-weight="750" fill="#17877f">2</text><text x="353" y="294" class="t">Count / compact</text><text x="326" y="322" class="p">Use token-count endpoint when the</text><text x="326" y="341" class="p">specific request shape is supported;</text><text x="326" y="360" class="p">otherwise conservative estimator.</text><text x="326" y="379" class="p">Deterministic relevance trimming.</text>
<rect x="590" y="268" width="250" height="125" rx="13" fill="#fff7e9" stroke="#edd3ad"/><circle cx="614" cy="291" r="11" fill="#ffedcf"/><text x="614" y="295" text-anchor="middle" font-size="10" font-weight="750" fill="#b86c25">3</text><text x="633" y="294" class="t">Reserve output</text><text x="606" y="322" class="p">Input + maximum output token cap</text><text x="606" y="341" class="p">must fit context and cost policy.</text><text x="606" y="360" class="p">Leave overhead/headroom.</text><text x="606" y="379" class="p">Price is config, not a code constant.</text>
<path d="M280 330H302" class="ln"/><path d="M560 330H582" class="ln"/><path d="M840 330H865" class="ln"/>
<path d="M930 330l64-46 64 46-64 46z" fill="#e3f6f0" stroke="#a9dbd2" stroke-width="1.7"/><text x="994" y="325" text-anchor="middle" class="t">Within every</text><text x="994" y="342" text-anchor="middle" class="t">budget?</text>
<path d="M1058 330H1083" class="ln"/>
<rect x="1090" y="268" width="310" height="125" rx="13" fill="#fff" stroke="#bfe3db"/><circle cx="1114" cy="291" r="11" fill="#ddf5ef"/><text x="1114" y="295" text-anchor="middle" font-size="10" font-weight="750" fill="#17877f">4</text><text x="1133" y="294" class="t">Bounded model call</text><text x="1106" y="322" class="p">Named op, prompt/schema versions</text><text x="1106" y="341" class="p">Explicit max output + deadline</text><text x="1106" y="360" class="p">Provider-aware retry classification</text><text x="1106" y="379" class="p">No unbounded agent/tool loop</text>
<path d="M994 376V425H442V402" fill="none" stroke="#bd762b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="610" y="419" class="tag" fill="#a15d20">NO → COMPACT / REJECT / INCONCLUSIVE</text>
<rect x="310" y="444" width="1090" height="116" rx="14" fill="#e9efff" stroke="#cbd7f2"/><text x="334" y="472" class="t">5 / Reconcile provider usage before planning next work</text>
<g><rect x="334" y="489" width="238" height="52" rx="9" fill="#fff" stroke="#cbd7f2"/><text x="348" y="509" class="tag" fill="#4057ae">ACTUAL TOKENS</text><text x="348" y="527" class="p">Input / output / cache fields if returned</text><rect x="586" y="489" width="238" height="52" rx="9" fill="#fff" stroke="#cbd7f2"/><text x="600" y="509" class="tag" fill="#4057ae">COST LEDGER</text><text x="600" y="527" class="p">Usage × effective price version</text><rect x="838" y="489" width="238" height="52" rx="9" fill="#fff" stroke="#cbd7f2"/><text x="852" y="509" class="tag" fill="#4057ae">CUMULATIVE JOB</text><text x="852" y="527" class="p">Update durable usage/reservations</text><rect x="1090" y="489" width="286" height="52" rx="9" fill="#fff" stroke="#cbd7f2"/><text x="1104" y="509" class="tag" fill="#4057ae">NEXT CALL GATE</text><text x="1104" y="527" class="p">Enough reserve for retry or verifier?</text><path d="M572 515H580" class="ln"/><path d="M824 515H832" class="ln"/><path d="M1076 515H1084" class="ln"/></g>
<rect x="42" y="586" width="425" height="118" rx="13" fill="#fff" stroke="#d4deee"/><text x="64" y="614" class="t">Stop conditions</text><text x="64" y="638" class="p">Budget exhausted → typed stop/review state.</text><text x="64" y="657" class="p">Throttle → honor retry hint; same deadline/cap.</text><text x="64" y="676" class="p">Invalid output → one bounded repair at most.</text><text x="64" y="695" class="p">Skip optional verifier if the reserved budget is gone.</text>
<rect x="492" y="586" width="425" height="118" rx="13" fill="#fff" stroke="#bfe3db"/><text x="514" y="614" class="t">Cache semantics</text><text x="514" y="638" class="p">Prompt cache is a latency/cost optimization, not truth.</text><text x="514" y="657" class="p">Result-cache key: exact source + policy + prompt/schema</text><text x="514" y="676" class="p">+ model settings; authorization/freshness still rechecked.</text><text x="514" y="695" class="p">Do not rely on cache to enforce budgets or correctness.</text>
<rect x="942" y="586" width="458" height="118" rx="13" fill="#fff" stroke="#edd3ad"/><text x="964" y="614" class="t">Auditable without content leakage</text><text x="964" y="638" class="p">Persist usage, price version, model/prompt hash and request ID.</text><text x="964" y="657" class="p">Standard traces omit raw source, full prompts, responses and secrets.</text><text x="964" y="676" class="p">Use per-tenant/global admission control to prevent spend spikes.</text><text x="964" y="695" class="p">Provider usage is authoritative after a call; estimates are preflight.</text></g></svg>