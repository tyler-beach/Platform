<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 695" role="img" aria-labelledby="title desc">
<title id="title">AI token and spend budget control</title><desc id="desc">Budget control from exact request construction and input estimation through atomic cumulative reservation, bounded call execution, usage reconciliation and explicit stop conditions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526783"/></marker>
<marker id="tealarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#008c84"/></marker>
<marker id="orangearr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd762b"/></marker>
<style>
.kicker{font:800 13px Arial,system-ui,sans-serif;letter-spacing:1.8px;fill:#61748e}
.title{font:750 31px Arial,system-ui,sans-serif;letter-spacing:-.4px;fill:#152744}
.subtitle{font:400 16px Arial,system-ui,sans-serif;fill:#61748e}
.boundary{font:800 13px Arial,system-ui,sans-serif;letter-spacing:1.1px;fill:#304b70}
.zone{font:800 11.5px Arial,system-ui,sans-serif;letter-spacing:1px;fill:#52657e}
.svctitle{font:750 11.5px Arial,system-ui,sans-serif;fill:#1b2d49}
.svcsub{font:500 10px Arial,system-ui,sans-serif;fill:#6b7b91}
.nodehead{font:750 13px Arial,system-ui,sans-serif;fill:#162b48}
.nodecopy{font:500 10.5px Arial,system-ui,sans-serif;fill:#62748d}
.copy{font:500 13px Arial,system-ui,sans-serif;fill:#465d79}
.small{font:500 11.5px Arial,system-ui,sans-serif;fill:#637791}
.tiny{font:750 9.5px Arial,system-ui,sans-serif;letter-spacing:.25px;fill:#6a7b90}
.tag{font:800 10.5px Arial,system-ui,sans-serif;letter-spacing:.55px}
.flowlabel{font:700 10px Arial,system-ui,sans-serif;fill:#526783}
</style></defs><rect width="1320" height="695" fill="url(#bg)"/><text x="28" y="37" class="kicker" >AI RUNTIME  /  COST CONTROL</text><text x="28" y="76" class="title" >One shared budget across every attempt</text><text x="28" y="103" class="subtitle" >A call is admitted only when the job can reserve its worst-case exposure and finish within its deadline.</text><rect x="28" y="171" width="220" height="132" rx="12" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="50" cy="193" r="13" fill="#e7eef8"/><text x="50" y="197" class="tag" text-anchor="middle" fill="#38557b">1</text><text x="43" y="224" class="nodehead" >Build exact request</text><text x="43" y="247" class="nodecopy" >system + evidence + schema</text><text x="43" y="264" class="nodecopy" >source IDs + prompt version</text><rect x="274" y="171" width="220" height="132" rx="12" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="296" cy="193" r="13" fill="#e7eef8"/><text x="296" y="197" class="tag" text-anchor="middle" fill="#38557b">2</text><text x="289" y="224" class="nodehead" >Estimate + reserve</text><text x="289" y="247" class="nodecopy" >count input; reserve output</text><text x="289" y="264" class="nodecopy" >add overhead / retry exposure</text><rect x="520" y="171" width="220" height="132" rx="12" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="542" cy="193" r="13" fill="#e7eef8"/><text x="542" y="197" class="tag" text-anchor="middle" fill="#38557b">3</text><text x="535" y="224" class="nodehead" >Atomic budget gate</text><text x="535" y="247" class="nodecopy" >per-call and job-wide caps</text><text x="535" y="264" class="nodecopy" >parallel calls reserve safely</text><rect x="766" y="171" width="220" height="132" rx="12" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="788" cy="193" r="13" fill="#e7eef8"/><text x="788" y="197" class="tag" text-anchor="middle" fill="#38557b">4</text><text x="781" y="224" class="nodehead" >Execute bounded call</text><text x="781" y="247" class="nodecopy" >deadline + attempt ID</text><text x="781" y="264" class="nodecopy" >no call when reservation fails</text><rect x="1012" y="171" width="280" height="132" rx="12" fill="#fff" stroke="#cfdbe9" stroke-width="1.5"/><circle cx="1034" cy="193" r="13" fill="#e7eef8"/><text x="1034" y="197" class="tag" text-anchor="middle" fill="#38557b">5</text><text x="1027" y="224" class="nodehead" >Reconcile usage</text><text x="1027" y="247" class="nodecopy" >actual usage + price version</text><text x="1027" y="264" class="nodecopy" >release / settle reservation</text><path d="M248 235 H267" fill="none" stroke="#526783" stroke-width="2.4"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)/><path d="M494 235 H513" fill="none" stroke="#526783" stroke-width="2.4"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)/><path d="M740 235 H759" fill="none" stroke="#526783" stroke-width="2.4"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)/><path d="M986 235 H1005" fill="none" stroke="#526783" stroke-width="2.4"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)/><rect x="28" y="344" width="850" height="210" rx="14" fill="#f5f8fd" stroke="#aabed8" stroke-width="1.7"/><text x="48" y="370" class="zone" >CONCURRENCY-SAFE PER-JOB LEDGER</text><rect x="48" y="389" width="250" height="54" rx="8" fill="#fff" stroke="#d6e1ef"/><text x="60" y="410" class="nodehead" >Input / output tokens</text><text x="60" y="429" class="nodecopy" >reserved + actual</text><rect x="318" y="389" width="250" height="54" rx="8" fill="#fff" stroke="#d6e1ef"/><text x="330" y="410" class="nodehead" >Total model spend</text><text x="330" y="429" class="nodecopy" >estimated + billed</text><rect x="588" y="389" width="250" height="54" rx="8" fill="#fff" stroke="#d6e1ef"/><text x="600" y="410" class="nodehead" >Calls + retries</text><text x="600" y="429" class="nodecopy" >all branches share cap</text><rect x="48" y="456" width="250" height="54" rx="8" fill="#fff" stroke="#d6e1ef"/><text x="60" y="477" class="nodehead" >Elapsed deadline</text><text x="60" y="496" class="nodecopy" >one job deadline</text><rect x="318" y="456" width="250" height="54" rx="8" fill="#fff" stroke="#d6e1ef"/><text x="330" y="477" class="nodehead" >Concurrency</text><text x="330" y="496" class="nodecopy" >per-job / tenant / global</text><rect x="900" y="344" width="392" height="210" rx="14" fill="#fff8ed" stroke="#d9ad6d" stroke-width="1.7"/><text x="920" y="371" class="zone" fill="#955d1b">STOP CONDITIONS</text><text x="920" y="400" class="copy" >Reject before call when any reserve fails.</text><text x="920" y="428" class="copy" >Treat ambiguous usage conservatively.</text><text x="920" y="456" class="copy" >Do not reset caps on retry or repair.</text><text x="920" y="484" class="copy" >Skip optional verifier without reserve.</text><text x="920" y="512" class="copy" >Persist exhaustion reason for review.</text><path d="M1120 303 V327 H1090 V344" fill="none" stroke="#bd762b" stroke-width="2.1" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearr)/><rect x="28" y="580" width="1264" height="84" rx="12" fill="#eaf7f4" stroke="#a9d9cf"/><text x="48" y="606" class="zone" fill="#087f77">ACCOUNTING RULE</text><text x="48" y="630" class="copy" >Retries, repairs and selective verification use the same ledger. Reconcile provider-reported usage per attempt; unknown charges remain reserved until resolved.</text><text x="48" y="651" class="small" >Model/prompt/schema/policy/price versions and estimate method travel with each run for reproducible cost and quality review.</text></svg>